<script>/* Rewritten A1 and A2 texts: everyday words, short sentences, one idea per sentence.
   Length is not limited. Key terms stay, each explained with simple words. Questions are unchanged. */
const P=a=>a.map(t=>({t}));
Object.assign(window.A1[2],{paras:P([
"Gen Z are young people. Many of them have a new job. They are good with phones and computers. They want to learn new things at work.",
"AI is a new problem for them. It is a challenge. AI is a computer helper. AI can do some easy jobs. So young workers must learn to use AI.",
"Young workers also need soft skills. Soft skills are people skills. For example, they work well in a team. They talk well with other people.",
"Some young workers need help. A mentor can help them. A mentor is an older worker. A mentor gives good ideas. A mentor shows them how to work."])});
Object.assign(window.A1[3],{paras:P([
"Many things in shops cost a lot of money now. Many young people want to save money. They use an idea. The idea is called “loud budgeting”.",
"Loud budgeting means you talk about money. You do not hide it. For example, your friend says, “Let’s eat at a big restaurant.” You say, “I am saving money. Let’s go to a cheap place.” You are honest.",
"Business owners do this too. A shop owner buys things from another company. The price goes up. The owner says, “This price is too high.” Then they talk, and the price can go down."])});
Object.assign(window.A1[4],{paras:P([
"Many young people worry about the planet. The planet is our Earth. Summers are very hot. The air and water are dirty. This is pollution.",
"This worry has a name. It is called climate anxiety. Some young people feel sad. They stop trying.",
"But we can help the planet. We can plant trees. We can recycle bottles and paper. We can work together. When we work together, we feel hope. Hope is a good feeling about the future."])});
Object.assign(window.A1[5],{paras:P([
"Young people use social media every day. They chat with friends. They watch videos. It is fun.",
"But too much social media is not good. Some people look at other people’s photos. Then they feel bad about themselves. Some people use the phone late at night. Then they do not sleep well.",
"Some people get unkind messages online. This is called cyberbullying.",
"Here is a good idea. Turn off your phone at night. Meet your friends in person. This is called digital balance. It means a good mix of phone time and real life."])});
Object.assign(window.A1[6],{paras:P([
"Many people play video games. Some games are free. But inside the game, you pay for things. You pay a little money many times. These small payments are called microtransactions.",
"Some games use tricks. For example, the game says, “Wait ten hours, or pay now.” You do not want to wait, so you pay. These tricks are called dark patterns.",
"Children are easy to trick. So games must protect children. Game companies must be honest about money."])});
Object.assign(window.A1[7],{paras:P([
"Many university students use AI. AI is a computer helper. AI can answer questions fast. AI can help you study.",
"But AI is not always right. Sometimes AI says things that are not true. These false answers are called hallucinations. So you must check AI answers.",
"Do not ask AI to do all your homework. If AI does all your homework, you do not learn. Use AI to help you. Then think and write by yourself."])});
Object.assign(window.A1[8],{paras:P([
"Many young Saudis love video games. They play online with friends. Their friends can be in other cities.",
"Esports are big video game competitions. Teams play to win. Many people watch them. There is a big esports competition in Riyadh.",
"Gaming has many jobs. Some people are players. Some people make games. Some people are programmers. They write computer code.",
"Gaming is fun. But students must study too. School and university are important for your future."])});
Object.assign(window.A1[9],{paras:P([
"Many students use AI chatbots. A chatbot is a computer program. You write a question, and the chatbot answers your question. A chatbot can help you learn English words.",
"But do not copy the chatbot answer. First, read the answer. Then, write your own answer.",
"AI can be wrong. So check the answer in a book or on another website. Checking information is called digital literacy. AI is a helper. It is not your brain."])});
Object.assign(window.A1[10],{paras:P([
"Coffee is very important in Saudi Arabia. Guests come to a family home. The family gives them Saudi coffee and dates. This shows kindness to guests. We call this hospitality.",
"Today, many young Saudis also go to cafés. They meet friends there. They study there too. They try new drinks, like iced coffee.",
"Some people like the old coffee. Some people like the new drinks. Both bring people together."])});
Object.assign(window.A1[11],{paras:P([
"University students are very busy. They have classes and exams. So they often eat fast food.",
"Good food gives your body energy. This is nutrition. Eat vegetables and fruit. Eat eggs, fish, or chicken. Drink water.",
"You do not need to be perfect. Do small good things every day. For example, take water and fruit to university."])});
Object.assign(window.A1[12],{paras:P([
"Gen Z likes fitness. Fitness means a strong and healthy body. Young people go to the gym. They play football. They walk. They ride bikes.",
"Exercise gives you energy. It is more fun with friends. You do not need expensive things. A short walk is good too.",
"Rest is important too. Make a simple routine. A routine is what you do every week. For example, walk three times a week."])});
Object.assign(window.A1[13],{paras:P([
"Many young Saudis start their own business. This is called entrepreneurship. Some people open a shop online. Some people make a phone app.",
"A business is hard work. You must listen to your customers. Customers are the people who buy from you.",
"Students can start small. They can try an idea in a university project. Sometimes the idea does not work. That is OK. They can try again."])});
Object.assign(window.A1[14],{paras:P([
"AlUla is in Saudi Arabia. It has big red rocks and a beautiful desert. People lived there a long time ago.",
"In AlUla, there is an old place called Hegra. People cut big tombs into the rocks. A tomb is a place for dead people.",
"Many tourists visit AlUla today. Good tourists follow the rules. They do not write on the rocks. AlUla is our heritage. Heritage is our old history. We must protect it."])});
Object.assign(window.A1[15],{paras:P([
"What do young people want from a job? Money is important. But money is not everything. They also want to learn new things.",
"They want a kind manager. A manager is the boss. A good manager helps them.",
"They want time for family and rest. This is called work-life balance. AI will change some jobs. So workers must keep learning."])});

/* ---------------- A2 ---------------- */
Object.assign(window.A2[2],{paras:P([
"Gen Z is the name for young people born from about 1997 to 2012. Many of them now have their first jobs. They work in shops, offices, and banks. They are good with phones and computers. They bring new ideas and energy to work.",
"Many young workers want to learn new skills. They often ask their boss about training. Training means classes that teach you how to do your job. For them, learning is more important than a big job title. They want a clear career path. A career path is a plan for your future work.",
"But there is a new challenge. A challenge is a difficult problem. The challenge is AI. AI tools can write emails and answer questions very fast. Because of this, some easy jobs may change. So young workers need to learn how to use AI. They also need soft skills. Soft skills are people skills, like teamwork and talking well with others.",
"Some young people studied online during COVID. They did not learn office rules in person. These rules are called office etiquette. For example, how to write a polite email. A mentor can help them. A mentor is an older worker who gives advice and shows good behavior at work."])});
Object.assign(window.A2[3],{paras:P([
"Things in shops are more expensive now. Many young people find it hard to save money. Some of them use an idea called “loud budgeting”.",
"Loud budgeting means you talk openly about money. For example, your friend invites you to an expensive restaurant. You say, “I am saving money, so let’s go to a cheaper place.” You are honest, and you do not feel embarrassed. Your savings are the money you keep for later.",
"Small business owners do this too. A supplier is a company that sells things to a shop. When a supplier wants a higher price, the owner says, “This price is too high for us.” Then they talk about it. This talk is called a negotiation. After the negotiation, the supplier may give a discount. A discount is a lower price.",
"Business owners also watch their cashflow. Cashflow is the money that comes in and the money that goes out.",
"Loud budgeting is not about being rude. It is about saying “no” politely and keeping your money safe."])});
Object.assign(window.A2[4],{paras:P([
"Many young people worry about climate change. They see very hot summers, floods, and pollution. Pollution means dirty air, water, or land. This worry has a name: “climate anxiety”.",
"A big study asked people in 31 countries about the planet. About half of Gen Z said climate change affects their life a lot. Fewer older people said this.",
"Some young people feel the problem is too big. They lose hope and stop trying. Hope is the feeling that good things can happen.",
"But action can bring hope back. Young people can join a project in their city, plant trees, or recycle at their university. Recycle means to use old bottles and paper again. They also want leaders to make real changes. Working together helps people feel stronger. Action gives young people agency. Agency is the feeling that you can make a difference."])});
Object.assign(window.A2[5],{paras:P([
"Young people use social media every day. They chat with friends, share photos, and watch videos. It can be fun, but too much can make people feel bad.",
"A group in the UK asked 1,000 young people about social media. Most of them said it is bad for their mental health. Many felt they must look perfect online. They compared their lives to other people’s perfect photos. This can lower their self-esteem. Self-esteem is how you feel about yourself.",
"Social media can also hurt sleep. Some people use their phones late at night and sleep badly. Some people also get cyberbullying. Cyberbullying means unkind messages online.",
"You do not need to stop using social media. You can turn off notifications at night. Notifications are the messages that pop up on your phone. You can spend less time on screens and meet friends in person. This is called digital balance. Many young people feel happier when they do this."])});
Object.assign(window.A2[6],{paras:P([
"Many people play video games. Some games are free to download, but they ask you to pay for things inside the game. These small payments are called microtransactions. The ways a game makes money are called monetization.",
"Some games sell loot boxes. You pay money, but you do not know what is inside the box. It feels like gambling. Gambling means paying money for a chance to win. Some games are “pay-to-win”: if you pay, you get stronger than other players.",
"Games have good sides. They can teach teamwork and problem solving. But playing too much can hurt your sleep and your health. Some games also use tricks. For example, they make you wait a long time, so you pay money to skip the wait. These tricks are called dark patterns. This is called behavioral design: the game is made to change what players do.",
"Children are easy to trick, so games must protect them. Companies should be honest about prices. Players also need a digital balance between games and real life."])});
Object.assign(window.A2[7],{paras:P([
"AI is changing universities. Many students use AI chatbots. A chatbot is a computer program that answers your questions. Students use chatbots to ask questions, write, and study. AI can explain hard words and give feedback fast. Feedback means comments that help you do better.",
"AI can be a good study partner. But some students ask AI to write all their homework. Then they stop thinking for themselves. This is called cognitive offloading: you give your thinking to a machine. Slowly, they lose their own skills. This is called skill erosion.",
"AI also makes mistakes. Sometimes it gives false information. False means not true. These false answers are called hallucinations. AI can also be unfair to some groups of people. This is called algorithmic bias. So students must check AI answers. Also, some AI tools are not free, so some students cannot use them.",
"Because AI can write essays, many teachers now use new tests, like presentations and projects. In a presentation, you talk in front of the class. Writing clear questions and instructions for AI is called prompt engineering. Students need to learn how to use AI well and still think for themselves."])});
Object.assign(window.A2[8],{paras:P([
"Many young Saudis love video games. They play online with friends in other cities. Games can teach teamwork and fast thinking.",
"Esports are video game competitions. In a competition, people try to win. Teams play with rules, and big audiences watch them. An audience is the people who watch. The Esports World Cup in Riyadh is one big example.",
"Gaming can give many jobs, not only for players. People also work as designers, programmers, and commentators. A commentator talks about the game while people watch. A big tournament needs planning and good teamwork. A tournament is a big competition with many teams.",
"Saudi Arabia is putting money into gaming. But becoming famous is not easy or fast. Famous means many people know you. Students should keep studying, do sport, and learn computer skills too."])});
Object.assign(window.A2[9],{paras:P([
"Many students use AI chatbots. They ask questions in normal English, and the chatbot answers. A chatbot can explain new words and help students practise English.",
"A study in the USA found that more than half of teenagers use chatbots for schoolwork. But this study was about American teenagers, not Saudi students.",
"AI can help you learn. For example, you read the AI explanation. An explanation helps you understand something. Then you answer the question yourself. But if you copy the AI answer, you do not learn.",
"AI is not always right. Sometimes it gives wrong information. So students must check AI answers and keep thinking for themselves. This skill is called digital literacy. AI should be a helper, not a replacement for your brain. A replacement is something you use instead of another thing."])});
Object.assign(window.A2[10],{paras:P([
"In Saudi Arabia, coffee is very important. Families serve Saudi coffee and dates to guests. Guests are people who visit your home. This shows hospitality and respect. Hospitality means being kind and generous to visitors.",
"Today, many young Saudis also go to modern cafés. Students meet friends there after class. Some study or work on presentations there because cafés have Wi-Fi and comfortable chairs.",
"Café menus are different now. You can drink Saudi coffee, iced coffee, or special coffee from other countries. Some young people like to try new flavors. A flavor is the taste of food or a drink. Others still like traditional coffee. Traditional means old and part of our culture.",
"Old traditions and new cafés are not opposites. Both bring people together to talk and spend time with each other."])});
Object.assign(window.A2[11],{paras:P([
"University students are very busy. They have classes, homework, and exams. So they often choose food that is fast and easy.",
"Researchers at Northern Border University studied what students eat. But one university is not the same as every university in Saudi Arabia.",
"Nutrition means how food gives your body energy. Energy is the power to move, study, and work. A healthy meal can have vegetables, fruit, and protein. Protein is in eggs, beans, fish, and chicken. It helps your body grow strong. Fast food is not always bad; it depends on what is in it.",
"You do not need a hard diet. You can plan simple meals, carry water, and eat different foods. Habits are things you do again and again. Small good habits every day are better than trying to be perfect."])});
Object.assign(window.A2[12],{paras:P([
"For Gen Z, fitness is not only about the body. Fitness gives energy and confidence, and it is time with friends. Confidence means you feel good about yourself. Young people like many activities: the gym, football, walking, or cycling.",
"In 2025, The Gym Group asked young people about fitness. 44% said fitness is one of the top two things they spend money on.",
"Exercise is more fun with friends. A friend at the gym can help you keep going. Some people like to have goals. Others exercise to relax after a long day. Relax means to rest and feel calm.",
"You do not need expensive equipment, like big machines. Short exercise is fine. Rest is important too. Do not compare yourself with perfect photos online. Make a simple routine: things you do every week. Go slowly and keep going."])});
Object.assign(window.A2[13],{paras:P([
"Many young Saudis want to start their own business. This is called entrepreneurship. Some open a shop online. Others make a phone app or help with a problem in their city.",
"In 2025, people aged 18 to 40 owned more than 474,000 businesses in Saudi Arabia. That is 38% of all open businesses. But this age group is bigger than Gen Z.",
"Running a business is hard work. You must know what customers need. Customers are people who buy from you. You must think about costs. Costs are the money you must pay. You must also tell people about your product. And you must listen when customers do not like something.",
"Students can start small. They can try an idea in a university project and ask people what they think. If the idea does not work, they learn patience. Patience means waiting calmly and not giving up. Then they can try again."])});
Object.assign(window.A2[14],{paras:P([
"AlUla is in the northwest of Saudi Arabia. It has big red rocks and beautiful desert views. People lived and traded there a very long time ago.",
"One famous place in AlUla is Hegra. The Nabataeans lived there. They cut big tombs into the rocks. A tomb is a place for dead people. AlUla was also on old trade roads. People carried things to sell across Arabia.",
"Archaeologists study old buildings and old things to learn about the past. Other people work to protect the old places. Tourism means people travel to visit places. Tourism brings visitors and money, but too many visitors can damage old places.",
"Good tourists follow the rules and respect local people. They do not climb on old tombs. Old places like AlUla are our heritage. Heritage is the history we get from the past. We must protect it for the future."])});
Object.assign(window.A2[15],{paras:P([
"What do young people want from a job? Money is important, but it is not the only thing. Many also want training, kind coworkers, and flexible hours. Coworkers are the people you work with. Flexible hours means you can sometimes change your work time. They also want work that feels important.",
"A company called Deloitte asked more than 23,000 young people in 44 countries about work. Many said they want to learn and grow at work. But this survey is about many countries, not only Saudi Arabia.",
"Many new workers want a manager who gives helpful feedback. A manager is the boss of a team. Some prefer this to a big job title. They also want time for family, friends, and rest. This is called work-life balance.",
"AI will change some jobs. So workers need to keep learning new skills. People skills, like talking well and teamwork, are still very important."])});

<script>/* B1 texts for articles 8-15: same facts and key words as the original B2 texts, simpler language. Questions are reused. */
window.B1={
8:[
{t:"For many young Saudis, video games are more than a way to pass the time. Online games let friends work together, compete, and talk, even when they live in different cities. Gaming groups can give players a feeling of belonging, and competitive players often learn quick decision-making and teamwork. But enjoying games does not automatically mean someone is ready for a professional career."},
{t:"Esports is organized competitive video gaming, with trained teams, official rules, and live audiences. Big events like the Esports World Cup in Riyadh have made more people interested in the industry. These competitions bring together players, fans, organizers, and technology specialists, so the gaming world is much bigger than the people holding controllers."},
{t:"The industry is growing, and this may create different career paths. Professional players must practise a lot, but designers, programmers, commentators, and event managers bring their own expertise. A successful tournament needs planning, technical support, good communication, and coordination between teams."},
{t:"Saudi investment in gaming shows an ambition to grow entertainment and digital industries. Still, students should not expect to become famous overnight. It is important to keep up with studies, stay active, and have healthy screen-time habits. Gaming can inspire future goals if young people balance their enthusiasm with preparation and practical digital skills."}],
9:[
{t:"Artificial intelligence is now common in education, especially chatbots that answer questions in everyday language. Students can use them to understand difficult vocabulary, organize ideas, and practise English conversations. Their convenience makes them attractive, but their value depends on how thoughtfully students use them, not on how fast the chatbot answers."},
{t:"A 2026 Pew Research Center study looked at how teenagers in the United States use and understand AI. More than half of the teenagers in the survey said they used chatbots for schoolwork. These results describe American teenagers, so we should not treat them as facts about Saudi university students. Still, the questions they raise are useful for classrooms in other countries."},
{t:"Imagine a learner who asks AI to explain the difference between two English expressions. If the learner reads the explanation, looks at examples, and then answers alone, their understanding may grow. But copying an AI answer without checking it can stop real learning. The same tool can support active practice or passive dependence."},
{t:"AI systems sometimes give misleading details and say uncertain things very confidently. Students need digital literacy: the ability to evaluate information, compare sources, and see limits. Teachers can encourage learners to use AI as a tutor, not as a substitute for their own thinking. Learning to question an AI answer is now as important as asking a good question."}],
10:[
{t:"Coffee has an important place in Saudi social life. Serving Saudi coffee and dates to guests is connected to hospitality, respect, and welcoming people into the home. These customs often bring different generations together, so family members can share stories and keep strong relationships. But coffee culture is also changing as younger Saudis find new places and habits."},
{t:"In many cities, modern cafés are now popular meeting places. University students may go there to prepare presentations, review lessons, or meet friends after class. Others like the quiet atmosphere for working alone. Comfortable seats, internet, and good locations can make a café feel like a study space, not only a place to buy a drink."},
{t:"The menu also shows changing tastes. Next to traditional Saudi coffee, customers can choose espresso drinks, iced drinks, or specialty coffee. For some young customers, trying new flavours is part of the fun, while others still prefer traditional drinks. Café visits can also depend on design, social media recommendations, and the wish to spend time in a nice place."},
{t:"Traditional hospitality and contemporary café habits are not opposites. Both give chances for conversation and connection, but in different settings. A family gathering focuses on welcoming guests, while a café meeting may offer flexibility and independence. Seeing these similarities helps students understand how cultural practices evolve without new habits replacing old traditions."}],
11:[
{t:"University life can change the way students eat. Lectures, assignments, travel to campus, and exams all take time, so convenience often matters when students choose food. Some students cook at home, while others buy food near campus. These choices depend on real-life situations, not only on knowing which foods are healthy."},
{t:"Researchers at Northern Border University in Saudi Arabia studied the eating habits of students in health and non-health colleges. Their study is a useful example, but results from one university should not be applied to every Saudi student. Different timetables, access to meals, and personal tastes may lead to different results in other places."},
{t:"Nutrition is how food gives the body energy and important substances. A balanced diet can include vegetables, fruit, whole grains, and protein such as eggs, beans, fish, or chicken. But students also think about affordability, what food is available, and how long it takes to cook. A quick meal is not always a bad meal; it depends on what is in it. Eating regularly and watching portion sizes can support well-being."},
{t:"Eating better does not need a complicated diet. Planning a simple meal, carrying water, and eating different foods are practical steps for a busy timetable. The bigger lesson is that sustainable habits come from realistic choices repeated over time, not from being perfect at every meal. Universities can help by making nutrition information and reasonably priced meals easy to find."}],
12:[
{t:"For many people in Generation Z, fitness is connected to physical health, but also to energy, confidence, and social life. Young adults enjoy different activities, like weight training, football, walking, cycling, or group classes. Variety matters because people usually continue a routine when it is enjoyable and fits their life."},
{t:"A 2025 report by The Gym Group looked at the habits of Gen Z people in its survey. In that survey, 44% said fitness was their first or second spending priority. This suggests that some young adults see exercise as an important part of daily life. However, the results only show the people who took part, not every young person."},
{t:"Exercise can also help people connect. Meeting friends at a gym or joining a running group can increase motivation and give a sense of accountability, because others expect you to come. Some people like setting personal goals, while others want to relax after a busy day."},
{t:"A good routine needs balance. Students with little time can choose short sessions or simple activities without expensive equipment. Rest and recovery are also essential. Comparing yourself all the time with online fitness photos can create unrealistic expectations. Instead of following every trend, young adults can focus on slow progress, consistency, and healthy habits."}],
13:[
{t:"Entrepreneurship is becoming a popular career choice for young Saudis. Instead of only working for a company, some people want to create their own products or services. A business can start as an online store, a mobile app, or an idea that solves a local problem. But turning an idea into a reliable business needs more than excitement."},
{t:"The Saudi Press Agency reported that people aged 18 to 40 owned more than 474,000 active commercial registrations by the second quarter of 2025. This was 38% of all active registrations in the country. This age group is bigger than Gen Z, so the numbers are not only about Gen Z. They also do not show whether each business succeeds."},
{t:"Entrepreneurs work in areas like technology, media, gaming, and services. They need to understand customer needs, estimate costs, promote their products, and deal with surprises. Finding a real problem is often as important as designing an attractive solution. They must also listen carefully to criticism and change their plans when customers react in unexpected ways."},
{t:"Students interested in entrepreneurship can start small. They can test an idea in a university project, ask for feedback, or learn to make a simple budget. These experiences build initiative and resilience, even if they do not lead to a company right away. A realistic mindset mixes creativity with patience, evidence, and a wish to improve."}],
14:[
{t:"AlUla, in northwestern Saudi Arabia, is famous for its amazing sandstone rocks and historical landscape. The area also shows that communities lived, traded, and travelled there long before modern times. For young visitors, it is a chance to connect what they learn about history with real places they can explore."},
{t:"One of the most important sites is Hegra, an ancient settlement connected to the Nabataeans. Its huge tombs were carved directly into rock, showing great skill and special architecture. The region was also on trade routes where goods and travellers moved across the Arabian Peninsula, so AlUla was part of a wider network of exchange."},
{t:"Archaeologists study buildings, objects, and landscapes to understand how earlier societies lived. Preservation experts work to protect sites from damage, and organizations like UNESCO show the importance of cultural heritage. Protecting these places is difficult, because tourism brings visitors and money but can also put pressure on fragile historical sites."},
{t:"Responsible tourism means more than taking photos of famous places. Visitors can follow site rules, respect local communities, and learn why conservation matters. For Saudi students, AlUla raises an important question: how can a country welcome visitors and still protect its history? Thinking about both benefits and risks helps connect national heritage with good decisions for the future."}],
15:[
{t:"Choosing a career is about more than finding the occupation with the highest salary. Young adults may also think about training, supportive colleagues, flexibility, and a sense of purpose. This does not mean that money is unimportant. It shows that work decisions often mean balancing several needs at the same time."},
{t:"Deloitte’s 2025 survey asked more than 23,000 Gen Z and millennial people in 44 countries about work, learning, money worries, and well-being. Many said they value meaningful work and chances to develop. Because the survey includes two generations and many countries, its results show general patterns, not a picture of every Gen Z worker in Saudi Arabia."},
{t:"Professional growth can come from training, mentorship, or challenging tasks. A new employee might prefer a job where the manager gives constructive feedback, rather than a job with a bigger title but little guidance. Work-life balance also matters: people need enough time for family, friends, rest, and responsibilities outside work."},
{t:"Technology adds something new to future careers. Artificial intelligence may change some tasks, so adaptability and continued learning are becoming more valuable. At the same time, communication, cooperation, and problem-solving are still important human skills. Students can prepare by building both digital and interpersonal skills."}]

<script>/* Ten new B1 readings (16-25): source text + hand-written A2/A1 versions and question sets */
(function(){
const READ=[{"n":1,"title":"Why Are People in Some Countries Taller Than Others?","topic":"Geography & Human Biology","paras":["Have you ever wondered which country has the tallest people in the world? Research shows that young people in the Netherlands are among the tallest in the world, while young people in countries such as Timor-Leste and Guatemala are among the shortest on average. But why are there such large differences between countries?","According to a major international study published in The Lancet, 19-year-old Dutch men had an average height of 183.8 centimeters in 2019. Dutch women of the same age were approximately 170.4 centimeters tall. Other countries with tall young people included Montenegro, Estonia, and Denmark.","At the other end of the comparison, 19-year-old men in Timor-Leste, a small country in Southeast Asia, had an average height of only 160.1 centimeters. In Guatemala, a country in Central America, women of the same age had an average height of 150.9 centimeters. This means Dutch young men were approximately 24 centimeters taller than young men in Timor-Leste.","Scientists explain these differences through several factors. Genetics is one important reason because children inherit physical characteristics from their parents. However, genetics alone cannot explain why average heights change over time. Nutrition, healthcare, and living conditions also affect how children grow.","For example, children who receive enough protein, vitamins, and healthy food usually have a better opportunity to reach their natural height. Children who experience serious illnesses or poor nutrition may not grow as much. Research also shows that improved healthcare and food quality have helped people become taller over generations.","Interestingly, the average human height has increased by approximately 10 centimeters over the past century. However, taller does not always mean healthier. The differences between countries show how human growth is connected to both biology and the environment."],"sources":["NCD Risk Factor Collaboration (2020), The Lancet — Height and body-mass index trajectories https://pmc.ncbi.nlm.nih.gov/articles/PMC7658740/","Our World in Data — Human Height https://ourworldindata.org/human-height"]},{"n":2,"title":"Is English Really a Mixture of Different Languages?","topic":"Language & History","paras":["English is spoken by millions of people around the world, but its vocabulary has an interesting secret. Many common English words actually came from other languages. Over hundreds of years, English borrowed words from French, Latin, Old Norse, and many other languages. This is one reason English has such a large and varied vocabulary.","The earliest form of English developed from Germanic languages spoken by groups who moved to Britain many centuries ago. These languages influenced basic English words related to family, nature, and everyday life. Words such as house, mother, and water have Germanic origins.","Later, Vikings arrived in parts of Britain and brought Old Norse words with them. Contact between different communities changed the language. Common English words such as sky, egg, and they developed through this contact. English speakers gradually accepted these words into their daily conversations.","Another major change happened after the Norman Conquest in 1066. French became an important language among the ruling classes in England. As a result, many French words entered English, especially words connected to government, law, and social life.","Latin also influenced English, particularly in education, medicine, and science. Today, English continues to borrow words from different cultures. For example, algebra entered English through Arabic, showing how scientific knowledge and language can travel between civilizations.","The history of English shows that languages are not completely separate from one another. They change when people travel, trade, study, and communicate. Every borrowed word tells a small story about human contact and cultural exchange."],"sources":["Oxford Research Encyclopedia of Linguistics — The Contact History of English https://academic.oup.com/edited-volume/61882/chapter-abstract/547693858"]},{"n":3,"title":"The Hidden Meanings Behind Country Names","topic":"Geography, Language & Culture","paras":["Have you ever wondered why countries have their names? Some names come from old languages, while others describe the land or the people who lived there. The meanings of country names can reveal interesting stories about geography, history, and cultural identity.","Let us begin with Canada. Its name comes from the Indigenous word kanata, which means village or settlement. In 1535, French explorer Jacques Cartier heard this word from two Indigenous young people. He later used the name for a much larger area. Eventually, Canada became the official name of the country.","Japan has a different story. In Japanese, the country is called Nihon or Nippon, meaning the origin of the sun. This is why Japan is often called the Land of the Rising Sun. The name is connected to Japan’s location east of China, where the sun appears to rise.","Iceland and Greenland have especially surprising names. Iceland means land of ice, while Greenland means green land. However, Greenland is largely covered by ice, while Iceland has many green areas. According to historical stories, the Viking Erik the Red helped establish the name Greenland. One explanation is that the attractive name encouraged people to settle there.","Australia also has an interesting origin. The name comes from the Latin word australis, which means southern. European mapmakers once imagined a large unknown southern land. The explorer Matthew Flinders later supported using Australia as the name of the continent in the early 1800s.","These examples show that country names are more than simple words on maps. They reflect ancient languages, exploration, geographical location, and sometimes the decisions of historical figures. Learning where names come from can help us understand how people viewed the world in the past."],"sources":["Government of Canada — Origin of the Name Canada https://www.canada.ca/en/canadian-heritage/services/origin-name-canada.html","National Library of Australia — Where the name Australia came from https://www.library.gov.au/research/research-guides-0/where-name-australia-came","National Geographic — Iceland and Greenland names https://www.nationalgeographic.com/science/article/iceland-greenland-name-swap"]},{"n":4,"title":"Why Are Young People Having Fewer Children?","topic":"Generation Z, Society & Demography","paras":["In many countries, fewer babies are being born than in previous generations. This trend has become an important topic for governments, researchers, and families. Some people believe that young adults simply do not want children anymore. However, research suggests that the situation is more complicated.","Many young adults want to finish their education and find stable employment before starting a family. University degrees, professional training, and career development can take several years. As a result, marriage and parenthood may happen later than they did for previous generations.","Money is another important factor. Housing, transportation, childcare, and everyday expenses can be expensive. Some young adults worry that they will not earn enough money to support a family. Others are concerned about job security and their financial future.","In 2025, the United Nations Population Fund published research about falling birth rates. Its findings showed that many people were unable to have the number of children they wanted. Financial difficulties, housing problems, and uncertainty about the future were among the reasons.","Lower birth rates can create challenges for countries. Over time, societies may have fewer young workers and more older people. This can affect healthcare systems, economic growth, and the number of people available to support public services.","However, the reasons for falling birth rates are different across cultures and countries. Understanding young people’s real experiences is important. Governments may need to improve housing, employment opportunities, and family support rather than simply encourage people to have more children."],"sources":["UNFPA — State of World Population Report 2025 https://www.unfpa.org/press/unfpa-report-links-falling-birth-rates-cost-living-sexist-norms-fear-future"]},{"n":5,"title":"Why Do Teenagers Stay Up Late at Night?","topic":"Human Biology, Student Life & Psychology","paras":["Have you ever planned to sleep early but ended up staying awake until two in the morning? Many teenagers and university students experience this problem. Some stay awake because of homework, while others spend hours watching videos, playing games, or talking to friends. However, science shows that sleeping late is not always simply a bad habit.","The human body has an internal clock that controls when we feel sleepy and when we feel awake. This system is called the circadian rhythm. During adolescence, this internal clock often changes. Many teenagers naturally begin to feel sleepy later at night, even when they need to wake up early for school.","Technology can make the situation more difficult. Bright light from phones, computers, and other screens can affect sleep patterns. Exciting games, online conversations, and interesting videos may also encourage young people to stay awake longer than they planned.","According to the Centers for Disease Control and Prevention (CDC), teenagers aged 13–17 generally need between 8 and 10 hours of sleep each night. Adults aged 18–60 usually need at least 7 hours. However, many students do not reach these recommendations.","In a 2025 American high school survey, only 24% of students reported getting at least eight hours of sleep on an average school night. This means approximately three out of four students were not getting eight hours. Poor sleep can affect memory, concentration, and the ability to learn new information.","Scientists recommend regular sleeping times and reducing screen use before bed. Getting enough sleep is especially important for students because the brain needs rest to process information. A good night’s sleep can be just as important as spending more hours studying."],"sources":["CDC — About Sleep https://www.cdc.gov/sleep/about/index.html","CDC — Youth Risk Behavior Surveillance: Sleep https://www.cdc.gov/yrbs/youth-health-in-focus/sleep.html"]},{"n":6,"title":"Where Did the World’s First Civilizations Begin?","topic":"World History & Ancient Civilizations","paras":["Thousands of years before modern cities, smartphones, and cars, people built some of the world’s first civilizations. These societies developed cities, writing systems, laws, and organized governments. Many of the earliest civilizations appeared near rivers because water helped people grow food and support larger populations.","One of the earliest civilizations developed in Mesopotamia, in an area that is now mostly Iraq. Around 3400–3000 BCE, the Sumerians built large cities and developed one of the earliest known writing systems. They wrote on clay tablets using symbols called cuneiform. Their achievements influenced later civilizations.","Ancient Egypt developed along the Nile River. Farmers depended on the river because its floods helped make the land suitable for agriculture. Egyptian civilization became famous for building pyramids, creating a writing system called hieroglyphics, and developing knowledge in mathematics and architecture.","Another important civilization developed in the Indus Valley, in areas that are now Pakistan and northwestern India. By approximately 2500 BCE, large cities such as Mohenjo-daro had organized streets and advanced drainage systems. These systems helped people manage water and waste thousands of years before modern plumbing.","Ancient China also developed powerful civilizations. By around 1500 BCE, communities in China had developed important cities, bronze technology, and systems of government. Chinese civilizations later contributed major inventions, including paper, printing, and the compass.","Early civilizations developed in different parts of the world, often independently. Their achievements show that people from different cultures found creative solutions to similar problems. Understanding these ancient societies helps us appreciate how many ideas used in modern life began thousands of years ago."],"sources":["National Geographic Education — Key Components of Civilization https://education.nationalgeographic.org/resource/key-components-civilization/","Getty Museum — Mesopotamia: Civilization Begins https://www.getty.edu/art/exhibitions/mesopotamia/explore.html"]},{"n":7,"title":"How Does the Internet Travel Across the Ocean?","topic":"Technology, Geography & Engineering","paras":["When you send a message to a friend in another country, it may arrive in less than a second. When you watch a video from the United States or play an online game with someone in Europe, information travels across thousands of kilometers. But how does the internet move between continents? Surprisingly, most international internet data travels through cables under the ocean.","These cables are called submarine communication cables. They lie on the ocean floor and connect countries and continents. Many modern cables use fiber-optic technology, which carries information through tiny glass fibers using light signals. This allows enormous amounts of data to move at high speeds.","According to the International Telecommunication Union (ITU), submarine cables carry more than 99% of international data traffic. Satellites are also used for communication, but undersea cables remain extremely important because they can carry very large amounts of information efficiently.","Installing these cables is a difficult engineering project. Special ships carefully place cables on the ocean floor. Some cables travel thousands of kilometers through deep water. Engineers must plan their routes to avoid dangerous locations and reduce the possibility of damage.","However, underwater cables are not completely safe. Fishing equipment, ships’ anchors, and natural disasters can damage them. If an important cable breaks, internet services may become slower or stop working in some places. Engineers then need specialized ships and equipment to repair the damage.","In 2025, approximately six billion people worldwide were using the internet, according to the ITU. Every message, video call, and online game depends on a huge international communication system. The next time you open a website, remember that some of its information may have traveled through cables deep beneath the sea."],"sources":["ITU — Global Connectivity Report 2025 https://www.itu.int/itu-d/reports/statistics/global-connectivity-report-2025/"]},{"n":8,"title":"Why Are Some Languages Disappearing?","topic":"Language, Culture & Global Society","paras":["People around the world speak thousands of languages. Each language has its own vocabulary, history, and connection to a particular community. However, many languages are slowly disappearing. When the last fluent speakers of a language die without passing it to younger generations, that language may no longer be used in everyday life.","One reason languages disappear is migration. When families move to larger cities or different countries, they may begin speaking the language used in schools, workplaces, and public services. Over time, children may become more comfortable using this new language than their family’s traditional language.","Education and economic opportunities can also influence language use. Parents may encourage their children to learn a major international language because they believe it will help them find better jobs. Although learning additional languages is useful, smaller community languages may receive less attention.","UNESCO has warned that a large number of the world’s languages are endangered. Its research has highlighted that around 40% of languages could be at risk of disappearing. Many endangered languages are spoken by Indigenous communities with relatively small populations.","When a language disappears, communities may lose more than words. Traditional stories, songs, historical knowledge, and cultural expressions can become difficult to preserve. Language carries information about how people understand the natural world, their history, and their relationships.","Fortunately, some communities are working to protect their languages. They record older speakers, create dictionaries, develop digital learning materials, and teach young people traditional languages. Modern technology may help preserve linguistic diversity for future generations."],"sources":["UNESCO — Towards a World Atlas of Languages https://www.unesco.org/en/articles/towards-world-atlas-languages"]},{"n":9,"title":"What Are the Most Popular Video Games in the World?","topic":"Technology, Gaming & Global Entertainment","paras":["Video games have become one of the most popular forms of entertainment around the world. Millions of people play games on smartphones, computers, and gaming consoles. Some enjoy building virtual worlds, while others prefer racing, sports, adventure, or competitive games. But which video games are the most popular, and why do people spend so much time playing them?","Roblox is one of the world’s biggest gaming platforms. Unlike traditional games, Roblox allows users to explore millions of experiences created by other players. Some games focus on adventure, while others involve building, racing, or social activities. According to gaming research company Newzoo, Roblox was the most-played game on PC and console by total hours during the first half of 2026.","Minecraft is another extremely popular game. Players explore a world made of blocks, collect materials, and build different structures. Some create houses and cities, while others design complicated machines. Minecraft is popular partly because it gives players freedom to be creative and develop their own projects.","Fortnite is well known for its competitive gameplay and colorful characters. In its Battle Royale mode, players compete to survive and become the last player or team remaining. The game also offers social experiences and creative activities. Regular updates and special events help attract players.","Counter-Strike 2 is another major online game, especially on personal computers. Players work in teams and must communicate, plan strategies, and react quickly. According to Newzoo’s July 2026 rankings, Counter-Strike 2, Minecraft, Roblox, and Fortnite were the four most-played PC titles by monthly active users in the markets tracked.","What makes these games successful? Many allow players to communicate with friends, compete against others, and experience something new. Some also encourage creativity and teamwork. Gaming is no longer only about entertainment. It has become an important part of digital culture, bringing people from different countries together through shared experiences."],"sources":["Newzoo — July 2026 PC & Console Rankings https://newzoo.com/articles/july-2026-pc-console-rankings","Newzoo — Roblox Grows Up https://newzoo.com/reports/roblox-grows-up"]},{"n":10,"title":"Can Playing Video Games Improve Learning?","topic":"Gaming, Psychology & Education","paras":["Video games are one of the most popular forms of entertainment among young people. Some players enjoy sports games, while others prefer adventure, strategy, or puzzle games. Although video games are sometimes criticized for taking too much time, researchers have also studied how they may support learning and important thinking skills.","Many games require players to solve problems. In an adventure game, for example, players may need to understand clues, remember information, and make decisions. When one strategy does not work, they must try a different approach. These activities can encourage flexible thinking and persistence.","Video games may also create opportunities for cooperation. In multiplayer games, players often work together to achieve a shared goal. They need to communicate, divide responsibilities, and respond quickly when situations change. These experiences can provide opportunities to practice teamwork.","Some games can support creativity. Building games allow players to design buildings, cities, and imaginary worlds. Other games encourage players to develop characters, write stories, or create new challenges for other users.","UNICEF has discussed how video games can support creativity, connection, and learning when they are designed well. However, this does not mean that every game improves every skill. The benefits depend on the game, how it is played, and the player’s experience.","The future of gaming may include more educational experiences. Teachers and game designers can use challenges, rewards, and interactive stories to make learning more engaging. Video games are not a replacement for studying, but carefully designed games can become another useful tool for education."],"sources":["UNICEF Parenting — Video Games and Children: A Guide for Parents https://www.unicef.org/parenting/child-care/video-games-explainer"]},{"n":11,"title":"How Did Anime Become a Global Favorite?","topic":"Entertainment, History & Culture","paras":["Anime is the word for animation from Japan, and it has fans all over the world. Some anime are about sports or school life, while others tell stories from the past. How did anime become so popular?","The story of TV anime began in 1963, when Astro Boy appeared on Japanese television. Guinness World Records lists it as the first TV anime series. It was created by Osamu Tezuka, often called the “God of Manga.” Later that year, it also became the first Japanese animated series shown on American television.","Anime also gained respect as art. In 2003, Spirited Away, a film by Hayao Miyazaki, won the Academy Award for Best Animated Feature. It was the first anime film to win an Oscar. In 2025, Demon Slayer: Infinity Castle passed the earlier record held by Demon Slayer: Mugen Train and became the highest-grossing Japanese film ever.","Some anime became famous all over the world. Pokémon is the biggest: Guinness World Records calls it the most successful anime franchise of all time, with $105 billion earned by August 2021 from games, films, TV episodes, and merchandise. Dragon Ball began as a manga by Akira Toriyama in 1984, and its anime has been broadcast in more than 80 countries. One Piece, a manga by Eiichiro Oda that began in 1997, has more copies printed than any other comic series by a single author, more than 400 million, and its story also became an anime. These three are only a few of the many anime that people love.","Anime keeps growing in 2026. LiveChart.me, a website where fans keep lists of what they watch, ranks the new season of That Time I Got Reincarnated as a Slime, the second season of Frieren: Beyond Journey’s End, and the third season of Jujutsu Kaisen among its most popular anime of the year. Frieren returned in January 2026, and One Piece began its Elbaph Arc in April. Many of these shows are new seasons of stories that fans already love, so long-running series can bring old and new viewers together.","Many Arab viewers also grew up with anime. From the late 1970s, Arabic versions of Japanese series appeared on TV in countries such as Lebanon, Saudi Arabia, and Kuwait. Grendizer is one of the most famous, and many adults still remember its Arabic voices and theme songs. Captain Majid, the Arabic name for the football series Captain Tsubasa, also reached Arabic-speaking audiences.","Today, Saudi Arabia is part of the anime story as well. Manga Productions, supported by the Misk Foundation, creates manga, anime, and video games. With Japan’s Toei Animation, it made The Journey, a film that opened in Saudi Arabia and Japan in 2021. Its script was developed in Riyadh, and animators in Tokyo brought it to life.","Anime can also connect viewers with history. Vinland Saga, a manga by Makoto Yukimura, became an anime series in 2019. It is set in the Viking Age and is inspired by old Icelandic sagas about real explorers such as Thorfinn Karlsefni and Leif Erikson. Its hero is fictional, so viewers should remember that anime is entertainment, not a history textbook. Still, a good story can make people curious about the past."],"sources":["Guinness World Records — First anime (Astro Boy, 1963) https://www.guinnessworldrecords.com/world-records/738108-first-anime","Wikipedia — Astro Boy (1963 TV series) https://en.wikipedia.org/wiki/Astro_Boy_%281963_TV_series%29","Guinness World Records — First anime film to win an Oscar (Spirited Away) https://www.guinnessworldrecords.com/world-records/first-anime-film-to-win-an-oscar","Guinness World Records — Highest-grossing Japanese animated film at the global box office https://www.guinnessworldrecords.com/world-records/72369-highest-grossing-japanese-animated-film","Animation Magazine (2025) — Demon Slayer: Infinity Castle is the top Japanese movie of all time https://www.animationmagazine.net/2025/09/demon-slayer-infinity-castle-is-the-top-japanese-movie-of-all-time-scores-no-1-in-noram","Arab News — Grendizer at 50 https://www.arabnews.com/Grendizer50","AramcoWorld — Bringing Cultures Together Through Anime https://www.aramcoworld.com/learning-center/lessons/2023/bringing-cultures-together-through-anime","Wikipedia — Vinland Saga (manga) https://en.wikipedia.org/wiki/Vinland_Saga_%28manga%29","Guinness World Records — Highest-grossing anime franchise (Pokémon) https://www.guinnessworldrecords.com/world-records/738103-highest-grossing-anime-franchise","Guinness World Records — One Piece: the record of the mega-popular manga series explained (2023) https://www.guinnessworldrecords.com/news/2023/10/one-piece-the-record-of-the-mega-popular-manga-series-explained-760171","Wikipedia — Dragon Ball https://en.wikipedia.org/wiki/Dragon_Ball","LiveChart.me — Most Popular Anime of 2026 https://www.livechart.me/rankings/anime?metric=popularity&year=2026","GamesRadar — New anime in 2026: release dates https://www.gamesradar.com/new-anime-release-dates-upcoming-schedule/"]}];

add(27,{title:'Can You Study and Become a Pro Gamer?',topic:'Gaming & Student Life',
sources:['Esports World Cup Foundation (2025). Esports World Cup to feature record-breaking prize pool of more than $70 million. https://esportsworldcup.com/en/news/ewc-2025-prizepool','ONE Esports. Esports psychologist Mia Stellberg explains burnout in esports. https://www.oneesports.gg/gaming/esports-psychologist-mia-stellberg-explains-burnout-in-esports/','Esports.net. Why do esports gamers have short careers and what do they do after retirement? https://www.esports.net/news/industry/esports-stars-burn-out-young/'],
b1:[

"So, can a student do both? It is possible, but only with balance. Successful student gamers set clear limits, such as playing after their homework is finished. They protect their sleep, because tired players and tired students both perform badly. They also look for university esports clubs, where they can compete without stopping their studies.",
"In the end, gaming can be a serious goal, but education keeps future doors open. Skills like teamwork, quick decisions, and communication are useful in both worlds."],

mc("Why is a degree called a useful “plan B”?",["Only a few players earn enough from gaming alone","Universities pay gamers","Gaming careers last forever"],"Paragraph 3."),

[["professional","doing an activity as a paid job"],["demanding","needing a lot of time and effort"],["retire","to stop working at the end of a career"],["schedule","a plan of times for doing things"],["balance","a healthy mix of different activities"]],
[mc("You have an exam tomorrow and your team wants to practise tonight. What is the best choice?",["Study first, then play a short time if you have time","Play all night and skip the exam","Tell your team you will never play again"],"Set clear limits."),
mc("Which skill from gaming is also useful at university and work?",["Teamwork and communication","Staying awake all night","Buying new games"],"Paragraph 5.")]),

add(28,{title:'How Rules and Regulations Affect Small and Big Businesses',topic:'Economy & Business',
sources:['Crain, W. M. & Crain, N. V. (2023). The cost of federal regulation to the U.S. economy, manufacturing and small business. National Association of Manufacturers. https://nam.org/wp-content/uploads/2023/11/NAM-3731-Crains-Study-R3-V2-FIN.pdf','Arab News (2024). Monsha’at revolutionizing SME landscape in Saudi Arabia. https://www.arabnews.com/node/2569527'],
b1:[
"Every business must follow rules. There are rules about food safety, taxes, workers’ hours, and protecting the environment. These official rules are called regulations. They protect customers, workers, and the community. For example, a restaurant must keep its kitchen clean, and a factory must not pollute the river.",

"This matters in Saudi Arabia too. According to Monsha’at, the Saudi authority for small and medium enterprises, small and medium businesses make up about 99% of all businesses in the Kingdom. The goal is for them to produce 35% of the economy by 2030. To help them, Monsha’at offers training, advice, and simpler online services.",

mc("According to the 2023 study, how much did regulations cost small firms per employee each year?",["About 14,700 dollars","About 1,470 dollars","About 147,000 dollars"],"Paragraph 3."),
mc("Why are the costs harder for small businesses?",["They often have no team to handle the paperwork","They have too many lawyers","They do not pay taxes"],"Paragraph 3."),
mc("What percentage of businesses in Saudi Arabia are small and medium businesses?",["About 99%","About 35%","About 20%"],"Paragraph 4.")],
[tf("Regulations protect customers, workers, and the community.",true,"Paragraph 1."),tf("Small firms paid less per worker than large firms.",false,"They paid about 20% more."),tf("Monsha’at offers training and advice to small businesses.",true,"Paragraph 4.")],
[["regulations","official rules made to control how things are done"],["compliance","obeying rules"],["licence","an official paper that gives permission to do something"],["paperwork","forms and documents you must complete"],["enterprises","companies or businesses"]],
[mc("A government makes a new rule simpler and moves the forms online. Who benefits most, according to the article?",["Small businesses","Only very large companies","Nobody"],"Simple rules help small businesses most."),
mc("What is the writer’s main point?",["Rules are important, but they should be clear and fair so small businesses can grow","All rules should be removed","Only big companies matter"],"Paragraph 5.")]),
a2:[
"Every business must follow rules. For example, a restaurant must keep its kitchen clean, and a factory must not make the river dirty. These official rules are called regulations. They keep customers and workers safe.",
"Following the rules costs money and time. A company must fill in forms, pay for a licence, and train its workers. A licence is an official paper that says you can do something. Obeying the rules is called compliance.",
"Big companies have many workers to do this paperwork. But a small shop often has only one person: the owner. A study in the USA in 2023 found that rules cost small companies about 14,700 dollars for each worker every year. Big companies paid about 12,200 dollars for each worker. So small companies paid more.",

mc("In paragraph 3, “a small shop often has only one person: the owner.” Who does the paperwork?",["The owner","A team of lawyers","The customers"],"Paragraph 3.")],

[["rules","what you must or must not do"],["safe","not in danger"],["forms","papers with questions you must answer"],["owner","the person a business belongs to"]],

sources:['Real Madrid C.F. (2026). Real Madrid, the highest-earning club in the world according to Deloitte. https://www.realmadrid.com/en-US/news/club/latest-news/real-madrid-informe-2026-01-01-2026','Gulf News (2024). Football transfer spending hits record $9.63 billion in 2023: FIFA. https://gulfnews.com/sport/football/football-transfer-spending-hits-record-963-billion-in-2023-fifa-1.1706640227253','GlobalData (2024). 2024/25 Saudi Pro League to generate estimated $54.53 million in sponsorship revenue. https://www.globaldata.com/media/sport/2024-25-saudi-pro-league-generate-estimated-54-53-million-sponsorship-revenue-reveals-globaldata/','Arab News (2024). Saudi Arabia allocates $453m for 2024–2025 sports initiatives. https://www.arabnews.com/node/2581501'],

add(30,{title:'How Does Language Shape Culture?',topic:'Language & Culture',
sources:['Boroditsky, L. (2011). How language shapes thought. Scientific American, 304(2), 62–65. https://www.scientificamerican.com/article/how-language-shapes-thought'],
b1:[
"Language is more than a set of words. It carries the history, values, and habits of the people who speak it. Many researchers believe that the language we speak can also influence how we see the world. The scientist Lera Boroditsky has studied this question for many years.",
"One famous example comes from Kuuk Thaayorre, a language spoken in a community in northern Australia. Its speakers do not use words like “left” and “right”. Instead, they use north, south, east, and west, even for small things. A speaker might say, “There is an ant on your southwest leg.” Because of this, people in this community always know which direction they are facing.",
"Language can also affect how people think about time. In one study, people were asked to put pictures in order, like a man getting older. English speakers put the pictures from left to right. Speakers of Hebrew, which is written from right to left like Arabic, usually put them from right to left. Kuuk Thaayorre speakers put them from east to west, wherever they were sitting.",
"We can see the same link in Arabic. English has one word, “uncle”, but Arabic has two: عمّ, your father’s brother, and خال, your mother’s brother. This shows how important family relationships are in Arab culture. Daily expressions like “إن شاء الله” also show cultural and religious values.",
"When you learn English, you are not only learning new words. You are also learning a new way of seeing the world. At the same time, your first language keeps your own culture alive."],
q1:B1([
mc("Who is the scientist mentioned in the article?",["Lera Boroditsky","Cristiano Ronaldo","A teacher in Riyadh"],"Paragraph 1."),
mc("Where is Kuuk Thaayorre spoken?",["In a community in northern Australia","In Saudi Arabia","In England"],"Paragraph 2."),
mc("What do Kuuk Thaayorre speakers use instead of “left” and “right”?",["North, south, east, and west","Up and down","Colours"],"Paragraph 2."),
mc("How did English speakers put the pictures in order?",["From left to right","From right to left","From east to west"],"Paragraph 3."),
mc("What does the Arabic word “خال” mean?",["Your mother’s brother","Your father’s brother","Your cousin"],"Paragraph 4.")],
[tf("Hebrew is written from right to left, like Arabic.",true,"Paragraph 3."),tf("English has two different words for a father’s brother and a mother’s brother.",false,"English only has “uncle”."),tf("Learning a new language can teach a new way of seeing the world.",true,"Paragraph 5.")],
[["influence","to have an effect on something"],["direction","the way something faces or moves, like north"],["values","beliefs about what is important"],["expressions","groups of words with a special meaning"],["community","a group of people who live in the same place"]],
[mc("Why does the writer use the example of “عمّ” and “خال”?",["To show that family relationships are important in Arab culture","To show that Arabic has no words for family","To teach the history of Australia"],"Paragraph 4."),
mc("Which sentence best gives the main idea?",["The language we speak is connected to how we think and to our culture","All languages are exactly the same","Only English is important"],"Paragraphs 1 and 5.")]),
a2:[
"Language is not only words. It also carries the history and values of the people who speak it. Values are the things people think are important. Some scientists believe our language can change how we see the world.",
"In northern Australia, people in a small community speak a language called Kuuk Thaayorre. They do not say “left” or “right”. They say north, south, east, and west. For example: “There is an ant on your southwest leg.” So these people always know their direction.",
"Language can also change how we think about time. In one study, people put pictures in order. English speakers put them from left to right. People who read Hebrew, from right to left like Arabic, put them from right to left.",
"Arabic shows our culture too. In English, there is only one word: “uncle”. In Arabic, there are two: عمّ (your father’s brother) and خال (your mother’s brother). This shows that family is very important in Arab culture. When you learn English, you learn a new way to see the world. And your Arabic keeps your culture alive."],
q2:L([
mc("What is the main idea?",["Language is connected to culture and how we think","Language is only about grammar","All languages are the same"],"The whole article."),
mc("What are values?",["Things people think are important","Prices","Directions"],"Paragraph 1."),
mc("What do Kuuk Thaayorre speakers say instead of “left”?",["A direction like north or west","“Up”","Nothing"],"Paragraph 2."),
mc("How did English speakers put the pictures?",["From left to right","From right to left","In a circle"],"Paragraph 3."),
mc("In paragraph 2, “They do not say left or right” — “They” means…",["Kuuk Thaayorre speakers","English speakers","scientists"],"Paragraph 2.")],
[tf("Arabic has two words for uncle.",true,"Paragraph 4."),tf("English has two words for uncle.",false,"It has one."),tf("Kuuk Thaayorre speakers always know their direction.",true,"Paragraph 2.")],
[["language","the words people use to speak and write"],["culture","the way of life of a group of people"],["direction","north, south, east, or west"],["uncle","your father’s or mother’s brother"]],
[mc("Your English friend asks, “Why do you have two words for uncle?” What can you say?",["“In our culture, family is very important.”","“Arabic has no family words.”","“I don’t know any words.”"],"Paragraph 4.")]),

q3:L([

mc("What do some people in Australia say?",["North or south","Left or right","Up or down"]),

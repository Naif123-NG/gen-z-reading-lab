<style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-2;width:100%;height:100%;display:block}

header{max-width:1360px;margin:auto;padding:20px clamp(16px,3vw,36px);display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:'Space Grotesk',sans-serif;letter-spacing:2px;color:#fff;text-decoration:none;font-weight:700}

.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

button:hover:not(:disabled),.button:hover{border-color:var(--accent);background:rgba(255,255,255,.09)}

h2{font-size:clamp(21px,2.6vw,28px);margin:6px 0 12px}
h3{font-size:19px;margin:0 0 10px;color:var(--accent)}
.intro{color:var(--muted);max-width:660px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px;margin-top:30px}
.tile{border:1px solid var(--line);border-radius:22px;padding:26px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;overflow:hidden;color:inherit;text-decoration:none;min-height:240px;display:flex;flex-direction:column;align-items:flex-start;transition:transform .3s,border-color .3s}

.tile .number{font-size:52px;line-height:1;color:var(--tile);font-family:'Space Grotesk';opacity:.85}

.tile .meta{font-size:12px;color:#bcc9cb;margin-top:auto}
.tile .arrow{position:absolute;right:24px;top:24px;font-size:28px;color:var(--tile)}
.tile .pts{font-family:'Space Grotesk';font-size:15px;color:var(--tile);border:1px solid var(--tile);border-radius:30px;padding:3px 12px;margin-bottom:10px}
.total{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;margin-top:22px}
.total b{font-family:'Space Grotesk';font-size:40px;color:var(--accent);font-weight:600}
.panel{background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,36px)}
.solo{max-width:720px;margin:20px auto}
.muted{color:var(--muted)}
.pill{border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:30px;font-size:12px;display:inline-block}
.back{color:#c1cdce;text-decoration:none;font-size:14px}
input{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);border-radius:10px;color:#fff;padding:14px;font:inherit;margin:10px 0 18px}
label{display:block}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* study layout */
.study{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:22px;align-items:start;margin-top:16px}
.article-pane,.task-pane{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;scrollbar-width:thin;overscroll-behavior:contain}
.task-pane{padding-top:0}
.hint{font-size:13px;color:var(--muted);border:1px dashed rgba(255,255,255,.2);border-radius:12px;padding:10px 12px;margin:0 0 18px}
.para{margin:0 0 18px}
.para h3{margin-top:26px}
.reading{font-size:18.5px;line-height:1.95;margin:0}
.w{cursor:pointer;border-radius:5px;transition:background .15s,color .15s}
.w:hover{background:rgba(255,255,255,.1);color:var(--accent)}
.w.on{background:var(--accent);color:#0c1610}
.source{font-size:13px;color:var(--muted);font-style:italic;border-top:1px solid var(--line);padding-top:14px;margin-top:24px}
/* score bar */
.scorebar{position:sticky;top:0;z-index:5;margin:0 calc(-1*clamp(18px,3vw,36px)) 18px;padding:14px clamp(18px,3vw,36px);background:rgba(10,18,22,.94);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;border-radius:22px 22px 0 0}
.scorebar .big{font-family:'Space Grotesk';font-size:26px;color:var(--accent);font-weight:600}
.scorebar .small{font-size:13px;color:var(--muted)}
.prog{flex-basis:100%;height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .5s}
.block{margin:0 0 30px}
.q{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;background:rgba(0,0,0,.18)}
.q p.qt{margin:0 0 10px;font-weight:600;font-size:16.5px}
.q .num{color:var(--accent);margin-right:6px}
.choice{display:block;text-align:left;width:100%;margin:8px 0;padding:12px 14px;font-size:15.5px}
.tfrow{display:flex;gap:10px}.tfrow .choice{flex:1;text-align:center}
.choice.right,.mb.right{background:rgba(34,197,94,.22)!important;border-color:var(--ok)!important;color:#c9f7d8!important;font-weight:700}
.choice.wrong,.mb.wrong{background:rgba(239,68,68,.22)!important;border-color:var(--bad)!important;color:#ffd0d0!important;font-weight:700}
.choice.right:before{content:'✓ '}.choice.wrong:before{content:'✗ '}
.choice:disabled:not(.right):not(.wrong){opacity:.45}
.fb{margin:8px 0 0;font-size:14.5px;font-weight:600;border-radius:10px;padding:8px 12px}
.fb.ok{color:#86efac;background:rgba(34,197,94,.1)}.fb.no{color:#fca5a5;background:rgba(239,68,68,.1)}
.terms{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.terms .mb{padding:9px 14px;border-radius:30px;font-weight:600;font-size:15px}
.defs .mb{display:block;width:100%;text-align:left;margin:8px 0;font-size:14.5px;padding:11px 14px}
.mb.selected{border-color:var(--accent);background:rgba(165,243,106,.14)}
.mb.right{opacity:.85}
.mb.wrong{animation:shake .35s}

.think button{font-size:13px;padding:7px 12px}
.done{border:1px solid var(--accent);border-radius:16px;padding:18px;text-align:center}

.tabs{display:none}
.listen{font-size:13px;padding:6px 12px;border-radius:20px;margin-top:6px}
.para.now{background:rgba(255,255,255,.04);border-radius:12px;box-shadow:0 0 0 8px rgba(255,255,255,.04)}
.w.speak{background:#ffe066;color:#111}

.rwrap{overflow-x:auto}.chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 9px;margin:2px;font-size:12px;white-space:nowrap}.chip.full{border-color:var(--ok);color:#86efac}
.lvls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0 6px}
.lvl-label{font-size:13px;color:var(--muted);margin-right:4px}.lvl-label .ar{display:inline;margin-left:6px}
.lvlbtn{padding:7px 16px;border-radius:30px;font-weight:700;font-size:14px}
.lvlbtn.active{background:var(--accent);color:#0c1610;border-color:var(--accent)}
.tlvl{font-size:12px;color:#bcc9cb;margin-bottom:6px}

.lockpill{font-size:13px;font-weight:700;color:#ffd0d0;margin-bottom:8px}

@keyframes pop{from{opacity:0;transform:translateY(6px)}}

#pop .tr{font-family:'IBM Plex Sans Arabic';direction:rtl;text-align:right;font-size:22px;margin:6px 0 10px}
#pop .row{justify-content:space-between}
#pop button{font-size:13px;padding:7px 12px}
@media(max-width:900px){
 .study{display:block}
 .tabs{display:flex;position:sticky;top:0;z-index:20;gap:8px;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
 .tabs button{flex:1;font-size:14px;padding:10px}
 .tabs button.active{background:var(--accent);color:#0c1610;border-color:var(--accent);font-weight:700}
 .article-pane,.task-pane{position:static;max-height:none;overflow:visible}
 .scorebar{top:58px}
 .study[data-tab=article] .task-pane,.study[data-tab=task] .article-pane{display:none}
}
@media(max-width:650px){
 .tile{min-height:200px}.brand small{font-size:9px}.reading{font-size:17.5px}
 #pop{left:16px!important;right:16px;bottom:16px;top:auto!important;width:auto}
}

.source{font-style:normal;overflow-wrap:anywhere}
.source .srclabel{font-style:normal;color:var(--text);font-weight:600}
.source .srcline{margin:6px 0 0;font-style:italic}
.source a{color:var(--accent);text-underline-offset:3px}

.sg-head h3{margin:0;font-size:20px;color:#fff}

.sg-x{padding:6px 10px;font-size:13px;border-radius:10px}
.sg-intro{font-size:14px;margin:8px 0 12px}
.sg-lab{font-size:13px;font-weight:600;color:var(--text)}

.sg-panel input,.sg-panel textarea,.sg-panel select{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);border-radius:10px;color:#fff;padding:10px 12px;font:inherit;font-size:14.5px;margin:6px 0 12px;color-scheme:dark}
.sg-panel textarea{resize:vertical}
.sg-panel select option{background:#0c161a;color:#fff}
.sg-panel .primary{width:100%;margin-top:2px}
.sg-panel .fb{margin:0 0 12px}
.sg-fallback{margin:0 0 12px}

.sg-callout{display:flex;justify-content:space-between;align-items:center;gap:18px 28px;flex-wrap:wrap;margin-top:34px}
.sg-callout h2{margin:4px 0 6px}
.sg-callout p{margin:0}
.sg-callout>div{flex:1 1 320px;min-width:0}
.sg-item{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:rgba(0,0,0,.18)}

.sg-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sg-by{font-size:12.5px}
.sg-del{padding:6px 12px;font-size:13px;margin-top:6px}
@media(max-width:650px){.sg-fab .ar{display:none}.sg-panel{max-height:calc(100vh - 100px)}}
body.no-ar .sg-fab .ar{display:none!important}

<script>window.NEW=[
{id:6,title:'Behavioral Design in Video Games',
source:'Van Rooij, A. J., Birk, M. V., van der Hof, S., Ouburg, S., & van Hilten, S. (2021). Behavioral design in video games: A roadmap for ethical and responsible games that contribute to long-term consumer health and well-being. Trimbos Institute; Eindhoven University of Technology; Leiden University.',
paras:[
{h:'Section 1: Growth of Gaming & Evolving Business Models',t:"Video games are very popular, and the gaming industry makes a lot of money. In the past, you paid for a game once. Today, many games use free-to-play models: you download the game for free, but the game tries to make you spend money while you play. These small payments are called microtransactions. Players might buy special clothes for their characters (cosmetics) or loot boxes, mystery boxes where you do not know the prize until you pay to open them. Some games use a pay-to-win model, where paying real money gives you an advantage over other players."},
{t:"The way a game makes money changes how it is designed. For example, a game might make you wait a long time to finish building something, unless you pay to skip the wait. This is called behavioral design: the game is built to change the player's behavior, often to get more time or money. Young people are especially vulnerable because their brains are still developing. The methods a game company uses to make money are known as monetization."},
{h:'Section 2: Game, Gamer, and Gaming',t:"Video games are made by large companies, but also by small teams or one person, called indie developers. Gaming has good and bad sides. Games can teach you to solve problems, be creative, and work in a team. Some games, called exergames, even make you exercise. But playing usually means sitting for a long time (sedentary), and a small group of players play too much, which can cause bad sleep, arguments with family, or spending too much money."},
{t:"People have different motivations (reasons) to play: to make friends, complete hard challenges, or feel powerful. Game designers know this and sometimes use dark patterns, hidden tricks that purposely make you frustrated so you spend more time or money. To stay healthy, players need a digital balance, so screen time does not take away from their physical, social, and mental health."},
{h:"Section 3: Game Design and Children's Rights",t:"Children are vulnerable consumers because they are still growing, lack experience, and can be easily influenced by tricks. Laws say game makers must put the 'best interests of the child' first. Children have a right to play: games should help them learn, relax, and have fun safely, without stress or tricks that make it hard to stop playing."},
{t:"Game makers must protect children from economic exploitation, so games should not use dark patterns to make children spend real money. Many games use virtual currency (fake game money, like coins) that hides the real price of items. Games must also follow data protection rules. To collect a child's personal data, companies usually need consent (permission) from the child's parents."},
{h:'Section 4: Dealing with Behavioral Design in Games',t:"Today, games use business models that try to keep you playing and spending for a long time. The report says game makers need an important goal: ethical design, which means creating games that protect a player's physical, mental, social, and financial health. Companies also need transparency: they must be open and honest about how their game works and how it makes money. Independent experts should be able to audit (check) games for dark tricks."},
{t:"The report suggests that everyone work together. Governments need better policies (rules) to protect children. The game industry must stop using hidden tricks and give players tools to control their playing time. Researchers need to study how games change our behavior. Communities can also build 'living labs', places where parents, children, and experts learn and talk about healthy gaming. This is part of prevention: stopping problems before they start."},
{h:'Section 5: Study Guide',t:"Cosmetic items only change how a character looks and give no advantage. Loot boxes give random rewards, so they feel like gambling. Whales are a very small group of players (0.5%) who spend a lot of money and make up 50% of the revenue."},
{t:"A season pass: you pay once and unlock rewards over time. It uses commitment (I paid, so I must play) and FOMO (fear of missing out) to make players play every day. A game that is free but pushes you to pay uses the freemium model."}],
blocks:[
{title:'Section 1 · Business',qs:[
{q:"A 'free-to-play' game means you will never spend any money on it.",tf:false,e:"Free-to-play games are free to download, but they use other methods to make money, like microtransactions or ads."},
{q:"A 'loot box' is a mystery prize you buy with real money, but you do not know what is inside until you open it.",tf:true,e:"Loot boxes are a special type of purchase where the rewards are hidden before you buy them."}],
vocab:[['Monetization','The different methods a game company uses to make money from their game.'],['Microtransactions','Making small payments inside a video game to buy virtual items.'],['Loot box','A mystery prize box inside a game that you buy with real money, but you do not know what is inside until you open it.'],['Free-to-play','Games that do not cost money to download and start playing, but usually ask you to buy things later.'],['Pay-to-win','A system where players who spend real money get an unfair advantage over players who do not pay.'],['Behavioral design','Creating a game in a specific way to control or change how players act, feel, or spend their money.']],
think:{q:'How have video game business models changed over the years, and why does this change affect how games are made?',a:"In the past, you bought a game once. Today, 'live services' use microtransactions to keep making money. This matters because it changes design: developers might intentionally add long waiting times just to encourage players to spend money."}},
{title:'Section 2 · Gamer',qs:[
{q:"Playing video games only has negative effects on a person's health.",tf:false,e:"Games also have benefits, such as teaching teamwork, problem-solving, and exercising through exergames."},
{q:"'Dark patterns' are tricks used by game designers to frustrate players so they will spend more money or time.",tf:true,e:"Dark patterns use frustration and psychology to push players into company-friendly choices."}],
vocab:[['Indie developer','A small team or a single person who creates a video game on their own.'],['Exergame','A video game that makes you move your body and get physical exercise.'],['Sedentary','Spending a lot of time sitting down and not moving your body.'],['Motivation','The reason why a person wants to do something (like playing a game to make friends).'],['Dark pattern','A hidden design trick used by game makers to make you spend more time or money than you want to.'],['Digital balance','Finding a healthy mix between using screens and doing other things like sleeping, exercising, and seeing people.']],
think:{q:'What are the four main psychological reasons (motives) why gamers want to play video games?',a:'Gamers play for four reasons: Affiliation (friends), Achievement (mastering challenges), Power (influence), and Autonomy (freedom of choice).'}},
{title:'Section 3 · Rights',qs:[
{q:"Children are considered 'vulnerable consumers' because their brains are still developing.",tf:true,e:"Children lack experience and can be easier to influence or trick into making purchases."},
{q:"Game companies can collect as much personal data from children as they want without needing permission.",tf:false,e:"Rules like the GDPR protect children's data and usually require parental consent."}],
vocab:[['Vulnerable consumer','A buyer who can be easily tricked or influenced because of their young age or lack of experience.'],['Right to play',"A child's freedom to relax, have fun, and learn safely without being stressed or forced to play."],['Economic exploitation','Unfairly using someone, like tricking a child with hidden designs, just to make money from them.'],['Virtual currency','Fake money that you use only inside a video game (like V-Bucks, gems, or game coins).'],['Data protection',"Keeping a person's personal and private information safe online."],['Consent','Giving your permission or agreeing to let a company do something (like collect your data).']],
think:{q:"What does designing a game in the 'best interests of the child' mean?",a:"It means a company's top priority must be protecting the child's well-being and development, ensuring a safe, fun, and non-exploitative environment."}},
{title:'Section 4 · Ethics',qs:[
{q:"'Transparency' means that game companies should hide the true cost of items.",tf:false,e:"Transparency means being open and honest so players understand the real costs."},
{q:"To fix the problems in video games, governments, researchers, and the industry need to work together.",tf:true,e:"The report suggests a shared approach across all sectors to improve practices."}],
vocab:[['Ethical design',"Creating games in a good, responsible way that cares about the player's health and well-being."],['Transparency','Being open and honest, and not hiding information from the player.'],['Audit','An official check by experts to make sure a game or system is safe, fair, and working correctly.'],['Policies','Plans or rules made by a government or a business to control how things are done.'],['Prevention','Stopping a problem (like playing games too much or spending too much money) before it starts.'],['Living lab','A place (online or in real life) where people, parents, and experts can learn, discuss, and share information about games.']],
think:{q:"What is 'ethical and responsible behavioral design' in video games?",a:"It means creating games that actively protect and strengthen a player's health (mental, physical, financial) instead of only maximizing profit."}},
{title:'Section 5 · Study Guide',qs:[
{q:"Cosmetic microtransactions give players a direct advantage in gameplay.",tf:false,e:"Cosmetics only change the appearance; they do not provide an advantage."},
{q:"Season passes often use 'FOMO' to make players feel they must play daily.",tf:true,e:"Limited-time rewards make players afraid of losing content forever."}],
vocab:[['Cosmetic','Items that only change how a character looks, not how they play.'],['Whales','The very small group of players who spend massive amounts of money.'],['Revenue','The total amount of money a company makes from its sales.'],['FOMO','Fear Of Missing Out: the feeling that you must play or buy so you do not lose a reward.'],['Commitment','The feeling that you must play because you already paid money.'],['Freemium','A model where the game is free but puts heavy pressure on you to pay.']],
think:{q:'What are the three main psychological tricks used in a season pass?',a:'Commitment (I paid, I must play), FOMO (limited time to win), and Guilt (feeling bad for not finishing).'}}]},
{id:7,title:'Navigating the Algorithmic University',
paras:[
{h:'Paragraph 1: Entering the Algorithmic University',t:"Artificial Intelligence is changing higher education so fast that researchers now call modern colleges the Algorithmic University. Today, Generative AI (GenAI) tools, such as chatbots and large language models, can create text, write code, and answer questions instantly. Students use these tools for personalized learning, faster information access, and study support."},
{h:'Paragraph 2: Learning Partner vs. Cognitive Offloading',t:"When students use AI as a collaborative study partner to brainstorm ideas or get feedback, it can improve their learning. However, relying on AI to write entire assignments causes cognitive offloading, a process where students outsource their mental effort to technology instead of thinking for themselves. Over time, this over-reliance leads to skill erosion, making it harder for students to develop an independent writing voice and strong critical thinking."},
{h:'Paragraph 3: Agentic AI and Prompt Engineering',t:"Education is now moving toward agentic AI: advanced systems that act autonomously, maintain memory, and complete multi-step goals with little human help. To navigate these new tools safely, students and teachers need strong AI literacy and prompt engineering skills. Prompt engineering means learning how to write clear, effective instructions for AI, while AI literacy teaches students to understand how algorithms operate, what data they use, and where their limits lie."},
{h:'Paragraph 4: Ethical Risks, Algorithmic Bias, and the Equity Gap',t:"AI tools also create serious ethical concerns on campus. Because some AI models are trained on limited or unbalanced datasets, they can exhibit algorithmic bias, for example, misclassifying writing from non-native English speakers or penalizing underrepresented groups. Furthermore, AI can generate false information known as hallucinations. At the same time, the AI equity gap is growing: over half of higher education institutions do not provide free access to paid AI tools due to high costs, leaving lower-income students at a disadvantage."},
{h:'Paragraph 5: Assessment Redesign and Evaluative Judgment',t:"Because traditional written home essays can easily be created by AI, universities are focusing on assessment redesign to protect academic integrity. Instead of using unreliable automated detection software, teachers are introducing process-oriented tests, such as live oral presentations, video projects, and practical demonstrations. These activities help build evaluative judgment: the vital skill of critically checking, fact-checking, and evaluating AI outputs so human thinking stays at the center of education."}],
blocks:[
{title:'Part A · Vocabulary match',vocab:[['Agentic AI','Advanced systems that can act independently and complete tasks with little human help.'],['Algorithmic bias','Unfair results from AI because it learned from unbalanced or limited data.'],['Hallucinations','False or made-up information created by AI.'],['Evaluative judgment','The skill of critically checking and judging if AI information is correct.'],['Cognitive offloading','Relying on technology to do your thinking, which can stop you from learning.'],['Prompt engineering','Writing clear and effective instructions for an AI to follow.'],['Skill erosion',"Losing your abilities or knowledge over time because you don't practice them."]]},
{title:'Part B · True or false',qs:[
{q:'Cognitive offloading helps students develop a strong and independent writing voice.',tf:false},
{q:'Universities are introducing oral presentations and video projects to replace traditional essays.',tf:true},
{q:'All higher education institutions provide free access to paid AI tools for everyone.',tf:false}]},
{title:'Part C · Multiple choice',qs:[
{q:"What does 'prompt engineering' mean in the article?",choices:['Building new computers and robots for the university.','Writing clear and effective instructions for AI to understand.','Fixing broken chatbots and models.'],correct:1},
{q:"Why are teachers focusing on 'assessment redesign'?",choices:['Because traditional home essays can easily be created by AI.','Because students do not like doing oral presentations.','Because universities want to save money on paper.'],correct:0},
{q:"What is an example of 'algorithmic bias' mentioned in the text?",choices:['AI working completely autonomously without human help.','Misclassifying writing from non-native English speakers.','AI helping students brainstorm ideas faster.'],correct:1}]}]}
];

{id:8,title:'How Gaming Is Changing Young Saudis’ Future',level:'B2',
source:'Deloitte. (2025). Let’s play, Saudi Arabia! Esports report. https://www.deloitte.com/middle-east/en/services/consulting/research/lets-play-saudi-arabia-2025-report.html (Original B2 adaptation; not reproduced verbatim.)',
paras:[
{t:"For many young Saudis, video games are no longer simply a way to pass the time. Online games allow friends to cooperate, compete, and communicate, even when they live in different cities. Gaming communities can create a sense of belonging, while competitive players often develop quick decision-making and teamwork skills. However, enjoying games does not automatically mean someone is ready for a professional career."},
{t:"Esports refers to organized competitive video gaming, often involving trained teams, official rules, and live audiences. Major events such as the Esports World Cup in Riyadh have increased public attention on the industry. Such competitions bring together players, fans, organizers, and technology specialists, demonstrating that the gaming world extends far beyond the people holding controllers. Competitive events can attract international audiences, giving players opportunities to represent their teams while learning to perform under pressure."},
{t:"The industry's growth may create several career pathways. Professional players must practise consistently, but designers, programmers, commentators, and event managers contribute different expertise. A successful tournament, for instance, requires planning, technical support, effective communication, and coordination between teams. Students interested in gaming can therefore explore creative as well as technical subjects. Behind a successful tournament, technical specialists also manage broadcasting systems, internet connections, and the audience experience."},
{t:"Saudi investment in the sector reflects an ambition to develop entertainment and digital industries. Nevertheless, students should distinguish realistic opportunities from the idea of becoming famous overnight. Maintaining academic progress, physical activity, and healthy screen-time habits remains important. Gaming can inspire future goals, provided young people balance enthusiasm with preparation and recognize the range of skills that the industry demands. For students considering this field, combining creativity with practical digital skills may open more options than relying on gaming ability alone."}],
blocks:[
{title:'Comprehension',qs:[
{q:'What is esports, according to the article?',choices:['Organized competitive video gaming with teams, rules, and audiences','Any game played alone at home','A type of physical sport played outdoors'],correct:0,e:'Paragraph 2 defines esports as organized competitive video gaming.'},
{q:'Which major event in Riyadh is mentioned?',choices:['The Esports World Cup','The Olympic Games','The FIFA World Cup'],correct:0,e:'The Esports World Cup in Riyadh increased public attention.'},
{q:'Which job is NOT mentioned as part of the gaming industry?',choices:['Doctor','Commentator','Programmer'],correct:0,e:'Designers, programmers, commentators, and event managers are mentioned.'},
{q:'What does Saudi investment in the sector reflect?',choices:['An ambition to develop entertainment and digital industries','A plan to stop students from playing games','A wish to close universities'],correct:0,e:'See paragraph 4.'},
{q:'What skill can competitive players often develop?',choices:['Quick decision-making','Cooking','Driving'],correct:0,e:'Paragraph 1: quick decision-making and teamwork skills.'}]},
{title:'True or false',qs:[
{q:'Enjoying games automatically means someone is ready for a professional career.',tf:false,e:'The article says it does not automatically mean this.'},
{q:'A successful tournament needs planning and coordination between teams.',tf:true,e:'Paragraph 3 lists planning, technical support, communication, and coordination.'},
{q:'The article says students should stop caring about academic progress.',tf:false,e:'Maintaining academic progress remains important.'}]},

{q:'Why does the writer mention commentators, designers, and event managers?',choices:['To show the industry needs many different skills','To prove only players earn money','To explain how to win a game'],correct:0,e:'The gaming world extends far beyond the people holding controllers.'}]}]},

{id:9,title:'AI and Students: Helpful Tool or Problem?',level:'B2',
source:'Pew Research Center. (2026, February 24). How teens use and view AI. https://www.pewresearch.org/internet/2026/02/24/how-teens-use-and-view-ai/ (Original B2 adaptation; not reproduced verbatim.)',
paras:[
{t:"Artificial intelligence has become increasingly visible in education, particularly through chatbots that respond to questions in everyday language. Students can use these systems to clarify difficult vocabulary, organize ideas, and practise English conversations. Their convenience makes them appealing, but the educational value depends on how thoughtfully students use them rather than how quickly the chatbot produces an answer."},
{t:"A 2026 Pew Research Center study examined how teenagers in the United States use and understand AI. More than half of those surveyed reported using chatbots for schoolwork. Many also used AI to search for information. These findings describe American teenagers, so they should not automatically be treated as evidence about Saudi university students. Still, the questions they raise are relevant to classrooms elsewhere."},
{t:"Consider a learner who asks AI to explain the difference between two English expressions. Reading a simple explanation, examining examples, and then answering independently may strengthen understanding. By contrast, copying an AI-generated answer without checking it can prevent real learning. The same technology can therefore support either active practice or passive dependence. The important difference is whether students use the explanation to improve their understanding or simply copy a finished response."},
{t:"AI systems sometimes provide misleading details or express uncertain information confidently. Students need digital literacy: the ability to evaluate information, compare sources, and recognize limitations. Teachers can encourage learners to use AI as a tutor rather than a substitute for their own thinking. The central challenge is not whether students should use AI, but how they can remain responsible, curious, and independent while using it. Learning to question an AI-generated answer is becoming as important as learning how to ask a useful question."}],
blocks:[
{title:'Comprehension',qs:[
{q:'Who took part in the 2026 Pew Research Center study?',choices:['Teenagers in the United States','Saudi university students','Teachers in Europe'],correct:0,e:'The study examined teenagers in the United States.'},
{q:'How many of the surveyed teenagers used chatbots for schoolwork?',choices:['More than half','Almost none','Exactly ten'],correct:0,e:'More than half reported using chatbots for schoolwork.'},
{q:'According to paragraph 1, what does the educational value of chatbots depend on?',choices:['How thoughtfully students use them','How fast the chatbot answers','How expensive the chatbot is'],correct:0,e:'Value depends on how thoughtfully students use them.'},
{q:'What is digital literacy?',choices:['The ability to evaluate information, compare sources, and recognize limitations','The ability to type quickly','Knowing how to buy a new computer'],correct:0,e:'Defined in paragraph 4.'},
{q:'What problem can AI systems sometimes have?',choices:['They give misleading details confidently','They refuse to answer any question','They only work in Arabic'],correct:0,e:'AI can express uncertain information confidently.'}]},
{title:'True or false',qs:[
{q:'The Pew findings can automatically be used as evidence about Saudi university students.',tf:false,e:'They describe American teenagers only.'},
{q:'Copying an AI answer without checking it can prevent real learning.',tf:true,e:'Paragraph 3 says this directly.'},
{q:'The writer says students should never use AI.',tf:false,e:'The question is how, not whether, to use AI.'}]},
{title:'Vocabulary match',vocab:[['chatbots','computer programs that answer questions in everyday language'],['convenience','being easy and quick to use'],['dependence','needing something too much to work without it'],['misleading','giving a wrong idea or impression'],['substitute','something used instead of another thing']]},
{title:'Think deeper',qs:[
{q:'Which use of AI shows active practice rather than passive dependence?',choices:['Asking AI for an explanation, then answering the exercise yourself','Copying the full AI answer into your homework','Asking AI to write your essay and submitting it'],correct:0,e:'Answering independently strengthens understanding.'},
{q:'AI gives you a fact for your report. What should you do first?',choices:['Check it against another reliable source','Use it without checking','Delete your report'],correct:0,e:'Digital literacy means comparing sources.'}]}]},

{id:10,title:'Why Young Saudis Love Coffee Shops',level:'B2',
source:'Arab News. (2022, September 29). Young and the restless: How the Kingdom’s youth are changing its cafe culture. https://www.arabnews.com/saudi-arabia/young-and-the-restless-how-the-kingdoms-youth-are-changing-its-cafe-culture-2170776 (Original B2 adaptation; not reproduced verbatim.)',
paras:[
{t:"Coffee has long played a meaningful role in Saudi social life. Serving Saudi coffee and dates to guests is closely associated with hospitality, respect, and welcoming others into the home. These customs often bring generations together, allowing family members to exchange stories and maintain relationships. Yet coffee culture is also changing as younger Saudis adopt new places and habits for socializing."},
{t:"In many cities, modern cafés have become familiar meeting places. University students may gather there to prepare presentations, review lessons, or meet friends after class. Others prefer the quiet atmosphere for individual work. Comfortable seating, internet access, and convenient locations can make a café feel like an extension of a study space rather than only somewhere to purchase a drink. Different cafés also offer different atmospheres, from quiet study spaces to lively places for group conversations."},
{t:"The menu also reflects changing preferences. Alongside traditional Saudi coffee, customers may choose espresso-based drinks, iced beverages, or specialty coffee made using different preparation methods. For some young customers, discovering new flavours is part of the experience, while others continue to prefer familiar traditional drinks. Café visits may also be influenced by design, social media recommendations, and the desire to spend time in an attractive environment."},
{t:"Traditional hospitality and contemporary café habits are not necessarily opposites. Both can provide opportunities for conversation and connection, although the setting and expectations differ. A family gathering may emphasize welcoming guests, while a café meeting may offer flexibility and independence. Understanding these similarities helps students explore how cultural practices evolve without assuming that new habits must replace older traditions. It can also help them see how daily routines express both cultural identity and personal preference."}],
blocks:[
{title:'Comprehension',qs:[
{q:'What is serving Saudi coffee and dates closely associated with?',choices:['Hospitality and respect','Business meetings only','Fast food'],correct:0,e:'Paragraph 1: hospitality, respect, and welcoming others.'},
{q:'Why might university students go to modern cafés?',choices:['To prepare presentations or meet friends after class','To take their final exams','To buy textbooks'],correct:0,e:'See paragraph 2.'},
{q:'Which drink is NOT mentioned on the café menu?',choices:['Orange juice','Espresso-based drinks','Specialty coffee'],correct:0,e:'Espresso drinks, iced beverages, and specialty coffee are mentioned.'},
{q:'What can influence café visits, according to paragraph 3?',choices:['Design and social media recommendations','The weather only','University rules'],correct:0,e:'Design, recommendations, and an attractive environment.'},
{q:'What can a café meeting offer, according to paragraph 4?',choices:['Flexibility and independence','Free meals','A quiet library'],correct:0,e:'A café meeting may offer flexibility and independence.'}]},
{title:'True or false',qs:[
{q:'The writer says new café habits must replace older traditions.',tf:false,e:'They are not necessarily opposites.'},
{q:'Some young customers still prefer familiar traditional drinks.',tf:true,e:'Paragraph 3 says so.'},
{q:'All cafés have the same lively atmosphere.',tf:false,e:'Cafés range from quiet study spaces to lively places.'}]},
{title:'Vocabulary match',vocab:[['hospitality','being friendly and generous to guests'],['customs','traditional ways of doing things'],['atmosphere','the feeling or mood of a place'],['contemporary','modern; belonging to the present time'],['evolve','to change and develop slowly']]},
{title:'Think deeper',qs:[
{q:'What is the main idea of the article?',choices:['Coffee culture is changing but still connects people, like traditional hospitality','Young Saudis have stopped drinking Saudi coffee','Cafés are only for studying'],correct:0,e:'Both traditions and cafés offer conversation and connection.'},
{q:'A student wants to work alone on an essay. Which café would suit them best?',choices:['A quiet café with comfortable seating and internet','A lively café full of group conversations','A café with no seating'],correct:0,e:'Some students prefer a quiet atmosphere for individual work.'}]}]},

{id:11,title:'What Do Saudi University Students Eat?',level:'B2',
source:'Bayomy, H. et al. (2024). Eating habits of students of health colleges and non-health colleges at the Northern Border University in the Kingdom of Saudi Arabia. PLOS ONE. https://doi.org/10.1371/journal.pone.0312750 (Original B2 adaptation; not reproduced verbatim.)',
paras:[
{t:"University life can influence the way students eat. Lectures, assignments, commuting, and examinations often compete for time, which may make convenience an important factor in daily food decisions. Some students prepare meals at home, while others buy food near campus. These choices are shaped by practical circumstances rather than simply by knowing which foods are healthy."},
{t:"Researchers at Northern Border University in Saudi Arabia investigated eating habits among students in health and non-health colleges. Their study provides a useful example of how food choices can be examined in a university setting. However, findings from one institution should not be generalized to every Saudi student. Differences in schedules, access to meals, and personal preferences may produce different patterns elsewhere."},
{t:"Nutrition refers to how food provides the body with energy and essential substances. A balanced eating pattern may include vegetables, fruit, whole grains, and sources of protein such as eggs, beans, fish, or chicken. Yet students must also consider affordability, availability, and the time required to prepare meals. A quick choice is not automatically a poor one; its nutritional value depends on what it contains. Eating regularly and paying attention to portion sizes can support well-being, although individual nutritional needs are not identical."},
{t:"Improving eating habits does not require a complicated diet. Planning a simple meal, carrying water, and choosing varied foods are practical steps that may fit a busy timetable. Students can also compare options rather than treating food as either completely healthy or unhealthy. The broader lesson is that sustainable habits emerge from realistic decisions repeated over time, not from perfection at every meal. Universities can also support better choices by making clear nutrition information and reasonably priced meals easier to find."}],
blocks:[
{title:'Comprehension',qs:[
{q:'Why is convenience important in students’ food decisions?',choices:['Lectures, assignments, and exams compete for their time','Students do not like cooking','Healthy food is not sold in Saudi Arabia'],correct:0,e:'Paragraph 1 explains the time pressure.'},
{q:'Where did the researchers carry out their study?',choices:['Northern Border University','King Saud University','A school in the United States'],correct:0,e:'Paragraph 2.'},
{q:'Which group of students did the study compare?',choices:['Students in health and non-health colleges','Men and women only','First-year and final-year students'],correct:0,e:'Health and non-health colleges.'},
{q:'Which is given as a source of protein?',choices:['Beans','Rice','Sugar'],correct:0,e:'Eggs, beans, fish, or chicken.'},
{q:'How can universities support better choices?',choices:['By making nutrition information and reasonably priced meals easy to find','By closing campus restaurants','By banning fast food completely'],correct:0,e:'See the last sentence of the article.'}]},
{title:'True or false',qs:[
{q:'Findings from one university should be applied to every Saudi student.',tf:false,e:'They should not be generalized.'},
{q:'A quick food choice is always a poor one.',tf:false,e:'Its value depends on what it contains.'},
{q:'Carrying water is one practical step to improve eating habits.',tf:true,e:'Paragraph 4 lists it.'}]},
{title:'Vocabulary match',vocab:[['nutrition','how food gives the body energy and important substances'],['affordability','how cheap or expensive something is for people'],['protein','a food substance found in eggs, fish, and beans'],['portion','the amount of food one person eats at a time'],['sustainable','able to continue for a long time']]},
{title:'Think deeper',qs:[
{q:'A student has only 20 minutes between classes. Which plan fits the article best?',choices:['Bring a simple planned meal and water','Skip eating every day','Wait until midnight to eat a big meal'],correct:0,e:'Planning simple meals fits a busy timetable.'},
{q:'What is the “broader lesson” of the article?',choices:['Good habits come from realistic decisions repeated over time','Every meal must be perfect','Only diets work'],correct:0,e:'Sustainable habits, not perfection.'}]}]},

{id:12,title:'Why Fitness Is Important to Gen Z',level:'B2',
source:'The Gym Group. (2025). Gen Z fitness pulse report 2025: Key findings. https://www.thegymgroup.com/blog/gen-z-fitness-pulse-report-key-findings/ (Original B2 adaptation; not reproduced verbatim.)',
paras:[
{t:"For many members of Generation Z, fitness is connected not only to physical health but also to energy, confidence, and social life. Young adults may prefer different activities, including weight training, football, walking, cycling, or group classes. The variety matters because a routine is more likely to continue when people find it enjoyable and suitable for their circumstances."},
{t:"A 2025 fitness report by The Gym Group explored the habits and priorities of surveyed Gen Z participants. In that survey, 44% ranked fitness as their first or second spending priority. The findings suggest that some young adults treat exercise as an important investment in daily life. However, survey findings reflect the people who took part, not necessarily every member of the generation."},
{t:"Exercise can also encourage social connection. Meeting friends at a gym or joining a running group may increase motivation and provide a sense of accountability. Some participants enjoy setting personal goals, while others value the opportunity to relax after a demanding day. These motivations explain why fitness may become part of an individual's identity rather than an occasional activity. Social encouragement can make an activity feel more enjoyable, particularly when participants have similar experience levels."},
{t:"A sustainable routine requires balance. Students with limited time may choose shorter sessions or simple activities that do not involve expensive equipment. Rest and recovery remain essential, and comparing oneself constantly with online fitness images can create unrealistic expectations. Instead of following every trend, young adults can focus on gradual progress, consistency, and habits that support their overall well-being. A useful fitness plan should fit a person’s health, abilities, schedule, and interests rather than copying an online trend."}],
blocks:[
{title:'Comprehension',qs:[
{q:'What percentage of surveyed participants ranked fitness as a first or second spending priority?',choices:['44%','14%','74%'],correct:0,e:'Paragraph 2 reports 44%.'},
{q:'Who published the 2025 fitness report?',choices:['The Gym Group','The World Health Organization','A Saudi university'],correct:0,e:'The Gym Group.'},
{q:'Why does variety in activities matter?',choices:['People continue a routine they find enjoyable','It makes exercise more expensive','It is required by law'],correct:0,e:'A routine is more likely to continue when enjoyable.'},
{q:'How can a running group help people?',choices:['It can increase motivation and accountability','It replaces sleep','It removes the need for rest'],correct:0,e:'Paragraph 3.'},
{q:'What can constantly comparing yourself with online fitness images create?',choices:['Unrealistic expectations','Better sleep','More free time'],correct:0,e:'Paragraph 4.'}]},
{title:'True or false',qs:[
{q:'The survey results describe every member of Gen Z in every country.',tf:false,e:'They reflect only the people who took part.'},
{q:'Rest and recovery are essential parts of a fitness routine.',tf:true,e:'Paragraph 4.'},
{q:'You need expensive equipment to exercise.',tf:false,e:'Simple activities can work without expensive equipment.'}]},
{title:'Vocabulary match',vocab:[['routine','a regular way of doing things'],['priority','something more important than other things'],['accountability','feeling responsible to others for what you do'],['recovery','time for the body to rest and become strong again'],['consistency','doing something regularly in the same way']]},
{title:'Think deeper',qs:[
{q:'A busy student wants to start exercising. Which plan is most realistic?',choices:['Short sessions three times a week that fit their schedule','Two hours every day copied from an influencer','Waiting until they have free time after graduation'],correct:0,e:'Fit the plan to your schedule; focus on gradual progress.'},
{q:'Why might fitness become part of someone’s identity?',choices:['Because of personal goals, friends, and the feeling it gives them','Because it is cheap','Because universities require it'],correct:0,e:'Motivations make it more than an occasional activity.'}]}]},

{id:13,title:'Young Saudis Are Building Their Own Businesses',level:'B2',
source:'Saudi Press Agency. (2025, July 15). Ministry of Commerce: Youth own over 474,000 businesses in Saudi Arabia. https://spa.gov.sa/en/N2361376 (Original B2 adaptation; not reproduced verbatim.)',
paras:[
{t:"Entrepreneurship is becoming an increasingly visible career option for young Saudis. Rather than working only for an established employer, some people hope to develop their own products or services. A business might begin with an online store, a useful mobile application, or an idea that solves a local problem. However, turning an interesting idea into a reliable business requires more than enthusiasm."},
{t:"According to information reported by the Saudi Press Agency, people aged 18 to 40 owned more than 474,000 active commercial registrations by the second quarter of 2025. These represented 38% of active registrations in the country. The age group is wider than Gen Z, so the numbers should not be presented as statistics for Gen Z alone. They nevertheless illustrate substantial business participation among younger adults, although they do not explain whether individual companies succeed."},
{t:"Entrepreneurs work across fields such as technology, media, gaming, and services. They may need to research customer needs, estimate costs, promote their products, and respond to unexpected challenges. A digital product, for example, may require programming skills alongside communication, teamwork, and financial planning. Identifying a genuine problem is often as important as designing an attractive solution. They must also listen carefully to criticism and adjust their plans when customers respond differently than expected."},
{t:"Students interested in entrepreneurship can begin on a small scale. They might test an idea through a university project, seek feedback, or learn to prepare a simple budget. Such experiences develop initiative and resilience even if they do not lead immediately to a company. A realistic entrepreneurial mindset combines creativity with patience, evidence, and a willingness to improve. This practical experience helps young people judge both the opportunities and the responsibilities that come with independence."}],
blocks:[
{title:'Comprehension',qs:[
{q:'How many active commercial registrations did people aged 18 to 40 own?',choices:['More than 474,000','About 47,000','Exactly 38,000'],correct:0,e:'Paragraph 2.'},
{q:'What percentage of active registrations did they represent?',choices:['38%','18%','74%'],correct:0,e:'38% of active registrations.'},
{q:'Why should these numbers not be presented as Gen Z statistics?',choices:['The age group 18–40 is wider than Gen Z','The numbers are from another country','The numbers are too small'],correct:0,e:'The age group is wider than Gen Z.'},
{q:'Which is NOT listed as a field where entrepreneurs work?',choices:['Farming','Technology','Gaming'],correct:0,e:'Technology, media, gaming, and services are listed.'},
{q:'According to the article, what is often as important as designing an attractive solution?',choices:['Identifying a genuine problem','Choosing a company logo','Finding a famous partner'],correct:0,e:'Paragraph 3.'}]},
{title:'True or false',qs:[
{q:'Enthusiasm alone is enough to build a reliable business.',tf:false,e:'It requires more than enthusiasm.'},
{q:'The registration numbers show which companies succeed.',tf:false,e:'They do not explain whether companies succeed.'},
{q:'Students can test a business idea through a university project.',tf:true,e:'Paragraph 4.'}]},
{title:'Vocabulary match',vocab:[['entrepreneurship','starting and running your own business'],['registrations','official records that a business exists'],['criticism','comments about what is wrong with something'],['initiative','the ability to start things without being told'],['resilience','the ability to recover after difficulties']]},
{title:'Think deeper',qs:[
{q:'Customers do not like a student’s new app. What should the student do?',choices:['Listen to the criticism and adjust the plan','Ignore customers and keep everything the same','Close the project immediately'],correct:0,e:'Entrepreneurs must listen and adjust.'},
{q:'Which describes a “realistic entrepreneurial mindset”?',choices:['Creativity together with patience, evidence, and willingness to improve','Expecting fast success without planning','Copying another company exactly'],correct:0,e:'See paragraph 4.'}]}]},

{id:14,title:'AlUla: Where Saudi History Meets the Future',level:'B2',
source:'UNESCO. (2025, July 1). AlUla, the pearl of the Saudi desert. https://www.unesco.org/en/articles/alula-pearl-saudi-desert (Original B2 adaptation; not reproduced verbatim.)',
paras:[
{t:"AlUla, in northwestern Saudi Arabia, is known for its dramatic sandstone formations and remarkable historical landscape. Beyond its natural beauty, the region offers evidence of communities that lived, traded, and travelled there long before the modern era. For young visitors, it provides an opportunity to connect what they learn about history with places they can actually explore. The region also offers a powerful example of how natural landscapes and human history can exist side by side."},
{t:"One of the area's most significant sites is Hegra, an ancient settlement associated with the Nabataeans. Its monumental tombs were carved directly into rock, displaying both skilled craftsmanship and distinctive architectural forms. The region was also linked to trade routes through which goods and travellers moved across the Arabian Peninsula. These details reveal that AlUla was part of wider networks of exchange. Learning about these sites encourages visitors to imagine the movement of people and ideas across the region long ago."},
{t:"Archaeologists investigate buildings, objects, and landscapes to understand how earlier societies lived. Preservation specialists work to protect sites from damage, while organizations such as UNESCO highlight the significance of cultural heritage. Protecting such places is challenging because tourism brings visitors and economic activity but can also increase pressure on fragile historical environments. Their work combines scientific methods with respect for places that remain important to local communities."},
{t:"Responsible tourism means more than taking photographs of famous landmarks. Visitors can follow site rules, respect local communities, and learn why conservation matters. For Saudi students, AlUla raises an important question: how can a country welcome visitors while safeguarding its history? Considering both benefits and risks helps connect national heritage with thoughtful decisions about the future. A thoughtful visitor may leave with a deeper understanding of why protecting heritage matters for future generations."}],
blocks:[
{title:'Comprehension',qs:[
{q:'Where is AlUla?',choices:['In northwestern Saudi Arabia','In eastern Saudi Arabia','On the Red Sea coast of Egypt'],correct:0,e:'Paragraph 1.'},
{q:'Which ancient people is Hegra associated with?',choices:['The Nabataeans','The Romans','The Vikings'],correct:0,e:'Paragraph 2.'},
{q:'How were the tombs at Hegra made?',choices:['They were carved directly into rock','They were built from wood','They were made of glass'],correct:0,e:'Carved directly into rock.'},
{q:'What do archaeologists do?',choices:['Study buildings, objects, and landscapes to understand earlier societies','Sell tickets to tourists','Build new hotels'],correct:0,e:'Paragraph 3.'},
{q:'Why is protecting places like AlUla challenging?',choices:['Tourism brings activity but also pressure on fragile sites','Nobody visits AlUla','The rocks are too new'],correct:0,e:'Tourism can increase pressure on fragile environments.'}]},
{title:'True or false',qs:[
{q:'AlUla was linked to trade routes across the Arabian Peninsula.',tf:true,e:'Paragraph 2.'},
{q:'Responsible tourism only means taking photographs of landmarks.',tf:false,e:'It means more than taking photographs.'},
{q:'Tourism has only benefits and no risks for historical sites.',tf:false,e:'It can increase pressure on fragile environments.'}]},
{title:'Vocabulary match',vocab:[['heritage','history and traditions passed down from the past'],['tombs','places where dead people are buried'],['archaeologists','scientists who study ancient people through objects and buildings'],['preservation','keeping something safe from damage'],['conservation','protecting natural or historical places']]},
{title:'Think deeper',qs:[
{q:'Which visitor behaviour best shows responsible tourism?',choices:['Following site rules and learning about the site’s history','Climbing on the tombs for a photo','Taking a small stone as a souvenir'],correct:0,e:'Follow rules and respect communities.'},
{q:'What question does AlUla raise for Saudi students?',choices:['How a country can welcome visitors while protecting its history','How to build more shopping centres','Why tourism should be stopped'],correct:0,e:'Paragraph 4.'}]}]},

{id:15,title:'What Does Gen Z Want from a Job?',level:'B2',
source:'Deloitte. (2025, May 14). Deloitte’s 2025 Gen Z and Millennial Survey. https://www.deloitte.com/global/en/about/press-room/deloitte-2025-gen-z-and-millennial-survey.html (Original B2 adaptation; not reproduced verbatim.)',
paras:[
{t:"Choosing a career involves more than identifying the occupation with the highest salary. Young adults may also consider whether a position offers useful training, supportive colleagues, flexibility, and a sense of purpose. These priorities do not mean that financial security is unimportant. Instead, they show that work decisions often involve balancing several needs at the same time. Personal priorities may also change as workers gain experience or take on new family and financial responsibilities."},
{t:"Deloitte's 2025 survey gathered responses from more than 23,000 Gen Z and millennial participants across 44 countries. It explored attitudes toward work, learning, financial concerns, and well-being. Many respondents valued meaningful work and opportunities to develop. Because the survey includes two generations and multiple countries, its findings should be read as broad patterns rather than as a description of every Gen Z employee in Saudi Arabia."},
{t:"Professional growth may involve formal training, mentorship, or the chance to undertake challenging tasks. A new employee might prefer a position where a manager provides constructive feedback over one offering a more impressive title but little guidance. Work-life balance is another consideration: people need sufficient time for family, relationships, rest, and personal responsibilities outside employment. A supportive manager can make these opportunities clearer by offering useful feedback and realistic expectations."},
{t:"Technology adds another dimension to future careers. Artificial intelligence may change certain tasks, making adaptability and continued learning increasingly valuable. At the same time, communication, cooperation, and problem-solving remain important human abilities. Students preparing for employment can therefore build both digital and interpersonal skills. A rewarding career may be one that offers financial stability together with learning, contribution, and sustainable well-being. Workers may therefore benefit from regularly updating their skills while maintaining strong relationships with colleagues."}],
blocks:[
{title:'Comprehension',qs:[
{q:'How many people answered Deloitte’s 2025 survey?',choices:['More than 23,000','About 2,300','Exactly 44,000'],correct:0,e:'Paragraph 2.'},
{q:'How many countries were included in the survey?',choices:['44','23','10'],correct:0,e:'44 countries.'},
{q:'Which two generations took part?',choices:['Gen Z and millennials','Baby Boomers and Gen X','Only Gen Z'],correct:0,e:'Gen Z and millennial participants.'},
{q:'Besides salary, what may young adults consider when choosing a job?',choices:['Training, supportive colleagues, flexibility, and purpose','Only the office location','The colour of the uniform'],correct:0,e:'Paragraph 1.'},
{q:'According to paragraph 4, what makes adaptability more valuable?',choices:['AI may change certain tasks','Salaries are going down','People work fewer hours'],correct:0,e:'AI may change certain tasks.'}]},
{title:'True or false',qs:[
{q:'The article says financial security is unimportant to young adults.',tf:false,e:'These priorities do not mean financial security is unimportant.'},
{q:'The survey results describe every Gen Z employee in Saudi Arabia.',tf:false,e:'They should be read as broad patterns.'},
{q:'Communication and problem-solving remain important human abilities.',tf:true,e:'Paragraph 4.'}]},
{title:'Vocabulary match',vocab:[['occupation','a job or profession'],['flexibility','being able to change plans or working hours easily'],['constructive','helpful and meant to improve something'],['adaptability','the ability to change to suit new situations'],['interpersonal','relating to communication between people']]},
{title:'Think deeper',qs:[
{q:'Job A has a big title and no guidance. Job B has a normal title and a manager who gives useful feedback. Which fits the article’s ideas about growth?',choices:['Job B','Job A','Neither, because feedback is not useful'],correct:0,e:'Constructive feedback supports professional growth.'},
{q:'Which student plan best prepares for future careers, according to the article?',choices:['Learning digital tools while practising teamwork and communication','Studying only one software program','Avoiding technology completely'],correct:0,e:'Build both digital and interpersonal skills.'}]}]}
);

<script>/* A2 versions. First choice in every multiple-choice item is correct; the page mixes the order. */

2:{paras:[
{t:"Gen Z is the name for young people born from about 1997 to 2012. Many of them now have their first jobs. They work in shops, offices, banks, and companies. They are good with phones and computers, and they bring new energy to work."},
{t:"Many young workers want to learn new skills. They often ask their boss about training. For them, learning is more important than a big job title. They want a clear career path: a plan for their future work."},
{t:"But there is a new challenge: AI. AI tools can write emails and answer questions very fast. Some easy jobs may change because of this. So young workers need to learn how to use AI. They also need soft skills (people skills), like teamwork and good communication."},
{t:"Some young people studied online during COVID. They did not learn office rules in person. These rules are called office etiquette. A mentor can help them. A mentor is an older worker who gives advice and shows good behavior at work."}],

{q:'What do many young workers often ask their boss about?',choices:['Training','Holidays','Parking'],correct:0,e:'Paragraph 2.'},

{q:'In paragraph 2, “them” means…',choices:['young workers','bosses','job titles'],correct:0,e:'“For them” = for the young workers.'},

{title:'True or false',qs:[

3:{paras:[
{t:"Things in shops are more expensive now. Many young people find it hard to save money. Some of them use an idea called “loud budgeting”."},
{t:"Loud budgeting means you talk openly about money. For example, your friend invites you to an expensive restaurant. You say, “I am saving money, so let’s go to a cheaper place.” You are honest, and you do not feel embarrassed."},
{t:"Small business owners do this too. When a supplier wants a higher price, the owner says, “This price is too high for us.” Then they talk. This talk is called a negotiation, and the supplier may give a discount. Owners also watch their cashflow: the money that comes in and goes out."},
{t:"Loud budgeting is not about being rude. It is about setting limits and protecting your savings."}],
blocks:[
{title:'Understanding the text',qs:[
{q:'What is the main idea?',choices:['Talking openly about money can help you save','Restaurants are always expensive','Business owners never save money'],correct:0,e:'The whole article is about loud budgeting.'},
{q:'What does loud budgeting mean?',choices:['Talking openly about money','Shouting at shops','Spending all your money'],correct:0,e:'Paragraph 2.'},
{q:'What may the supplier give the business owner?',choices:['A discount','A new car','A free restaurant meal'],correct:0,e:'Paragraph 3.'},
{q:'In paragraph 1, “them” means…',choices:['young people','shops','things'],correct:0,e:'“Some of them” = some young people.'},
{q:'Why is it hard for young people to save money?',choices:['Things are more expensive now','They do not have friends','Banks are closed'],correct:0,e:'Paragraph 1.'}]},
{title:'True or false',qs:[
{q:'Loud budgeting means being rude to your friends.',tf:false,e:'It is not about being rude.'},
{q:'Small business owners also talk openly about prices.',tf:true,e:'Paragraph 3.'},
{q:'In the example, you feel embarrassed about saving.',tf:false,e:'You do not feel embarrassed.'}]},
{title:'Word match',vocab:[['expensive','costs a lot of money'],['cheaper','costs less money'],['discount','a lower price'],['savings','money you keep for later']]},
{title:'Think',qs:[

4:{paras:[
{t:"Many young people worry about climate change. They see hot summers, floods, and pollution. This worry has a name: “climate anxiety”."},
{t:"A big study asked people in 31 countries about the environment. About half of Gen Z said climate change affects their life a lot. Fewer older people said this."},
{t:"Some young people feel the problem is too big. They lose hope and stop trying."},
{t:"But action can bring hope back. Young people can join a local project, plant trees, or recycle at their university. They also want leaders to make real changes. Working together helps people feel stronger. Action gives young people agency: the feeling that they can make a difference."}],
blocks:[
{title:'Understanding the text',qs:[
{q:'What is the main idea?',choices:['Young people worry about climate, but action can bring hope','Climate change is not real','Older people worry more than young people'],correct:0,e:'The article moves from worry to action.'},
{q:'What is “climate anxiety”?',choices:['Worry about climate change','A kind of weather','A university subject'],correct:0,e:'Paragraph 1.'},
{q:'How many countries were in the study?',choices:['31','13','100'],correct:0,e:'Paragraph 2.'},
{q:'In paragraph 3, “They” means…',choices:['some young people','leaders','trees'],correct:0,e:'“They lose hope” = some young people.'},
{q:'What can young people do to help?',choices:['Join a local project or recycle','Stop talking to friends','Use more plastic'],correct:0,e:'Paragraph 4.'}]},
{title:'True or false',qs:[

{q:'Older people said this more than Gen Z.',tf:false,e:'Fewer older people said this.'},
{q:'Young people want leaders to make real changes.',tf:true,e:'Paragraph 4.'}]},
{title:'Word match',vocab:[['worry','to feel afraid that something bad will happen'],['pollution','dirty air, water, or land'],['hope','a feeling that good things can happen'],['recycle','to use old things again']]},
{title:'Think',qs:[
{q:'Your friend feels sad about the planet and does nothing. What is good advice?',choices:['Join a small project with others','Stop thinking about anything','Buy more things'],correct:0,e:'Action brings hope.'}]}]},

5:{paras:[
{t:"Young people use social media every day. They chat with friends, share photos, and watch videos. It can be fun, but too much can make people feel bad."},
{t:"A UK group asked 1,000 young people about social media. Most of them said it is bad for their mental health. Many felt they must look perfect online. They compared their lives to other people’s perfect photos. This can lower their self-esteem: how they feel about themselves."},
{t:"Social media can also hurt sleep. Some people use their phones late at night and sleep badly. Some people also see cyberbullying, which means unkind messages online."},
{t:"You do not need to stop using social media. You can turn off notifications at night, spend less time on screens, and meet friends in person. This is called digital balance. Many young people feel happier when they do this."}],
blocks:[
{title:'Understanding the text',qs:[
{q:'What is the main idea?',choices:['Social media can be fun, but we should use it in a healthy way','Social media is always bad','Everyone should delete their phones'],correct:0,e:'The writer gives problems and healthy tips.'},
{q:'How many young people did the UK group ask?',choices:['1,000','100','10,000'],correct:0,e:'Paragraph 2.'},
{q:'What is cyberbullying?',choices:['Unkind messages online','A new phone','A video game'],correct:0,e:'Paragraph 3.'},
{q:'In paragraph 2, “They” compared their lives to…',choices:['other people’s perfect photos','their teachers','old books'],correct:0,e:'Paragraph 2.'},

{title:'True or false',qs:[

{q:'Many young people feel happier with less screen time.',tf:true,e:'Paragraph 4.'}]},
{title:'Word match',vocab:[['share','to show or give something to others'],['perfect','with no problems at all'],['notifications','messages that appear on your phone'],['happier','more happy']]},
{title:'Think',qs:[
{q:'Your friend feels sad after looking at Instagram. What can you tell them?',choices:['“Many photos online are not real life.”','“Look at it all night.”','“Everyone online is perfect.”'],correct:0,e:'Online photos are often chosen carefully.'}]}]},

6:{paras:[
{t:"Many people play video games. Some games are free to download, but they ask you to pay for things inside the game. These small payments are called microtransactions. The ways a game makes money are called monetization."},
{t:"Some games sell loot boxes. You pay money, but you do not know what is inside. It feels like gambling. Some games are “pay-to-win”: if you pay, you get stronger than other players."},
{t:"Games have good sides. They can teach teamwork and problem solving. But playing too much can hurt your sleep and your health. Some games also use dark patterns, tricks that make you wait so you pay money. This is called behavioral design: the game is made to change how players act."},
{t:"Children are easy to trick, so games must protect them. Companies should be honest about prices. Players also need a digital balance between games and real life."}],
blocks:[
{title:'Understanding the text',qs:[
{q:'What is the main idea?',choices:['Some games use tricks to get money, so players must be careful','All video games are free','Games are only for children'],correct:0,e:'The article explains game money tricks.'},
